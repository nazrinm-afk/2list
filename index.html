// LAN HTTP does not expose Web Locks. A readwrite IndexedDB transaction

// This database holds no project data; existing rs:project:* keys stay intact.

    const db=opening.result;if(settled){db.close();return;}db.onversionchange=()=>db.close();

      tx.onabort=()=>{db.close();reject(error||new Error('Could not confirm the save. Keep a JSON backup and reload the saved version before retrying.'));};
      tx.objectStore('locks').get(name).onsuccess=()=>{try{result=run();}catch(e){error=e;tx.abort();}};
    }catch(e){db.close();reject(e);}

function buildGeminiPrompt(project, options) {

  const epLocation = s.episodeLocations?.[ep] || '';

  if (isQuestions) {

    const desc = rec?.description || '';

    return `Anda adalah seorang wartawan dan penyelidik televisyen profesional untuk rancangan "${programName}" di stesen "${station}".

Bahasa: Bahasa Melayu (natural dan santun).
Tetamu: ${guestName}${guestTitle ? ` (${guestTitle})` : ''}
Topik / Kapsul: ${topic}
${loc ? `Lokasi Penggambaran: ${loc}\n` : ''}${desc ? `Latar Belakang / Fakta Cerita:\n${desc}\n` : ''}${notes ? `Panduan Tambahan:\n${notes}\n` : ''}
PANDUAN FORMAT SOALAN:
- Formatkan output HANYA sebagai senarai soalan bernombor (1., 2., 3., ...).
- WAJIB berikan SATU BARIS KOSONG (DOUBLE SPACING / selang sebaris / \\n\\n) di antara setiap soalan supaya setiap soalan terpisah secara individu.

1. [Teks soalan pertama]

2. [Teks soalan kedua]

3. [Teks soalan ketiga]

  }

  const epThrows = (project.throws || []).filter(t => Number(t.episode) === ep);

  if (key === 'Op') {

    const lineup = candidates.map(c => `• Kapsul ${c.capsule}: ${c.topic || 'Topik'} (${c.description || ''})`).join('\n') ||
      epThrows.filter(t => t.topic?.startsWith('Throw')).map(t => `• ${t.topic}: ${t.description || t.location || ''}`).join('\n') ||
      '• Lineup cerita menarik';
    contextDetails = `Lineup Segmen Episod Ini:\n${lineup}`;
  } else if (key === 'Pr') {
    sectionName = 'PROMO (Teaser & Sorotan Episod)';
    const lineup = candidates.map(c => `• Kapsul ${c.capsule}: ${c.topic || 'Topik'} (${c.description || ''})`).join('\n') ||
      epThrows.filter(t => t.topic?.startsWith('Throw')).map(t => `• ${t.topic}: ${t.description || t.location || ''}`).join('\n') ||
      '• Sorotan episod';
    contextDetails = `Sorotan Kandungan Episod:\n${lineup}`;
  } else if (key === 'Clo') {
    sectionName = 'CLOSING (Penutup Episod & Ucapan Selamat Tinggal)';
    const lineup = candidates.map(c => `• ${c.topic || ''}`).filter(Boolean).join(', ') || 'semua kisah menarik tadi';
    contextDetails = `Kisah yang telah dipaparkan dalam episod ini: ${lineup}`;
  } else if (key.startsWith('T')) {
    const capNum = key.slice(1);
    sectionName = `THROW ${capNum} (Lontaran Memperkenalkan Kapsul ${capNum})`;
    const cap = candidates.find(c => c.capsule === capNum);
    const thr = epThrows.find(t => t.topic === `Throw ${capNum}` || t.topic === capNum);
    const topic = cap?.topic || thr?.topic || `Kapsul ${capNum}`;

- Kapsul #${capNum}: ${topic}
${desc ? `- Penerangan Kisah: ${desc}\n` : ''}${guest ? `- Tetamu Terlibat: ${guest}\n` : ''}${loc ? `- Lokasi: ${loc}\n` : ''}`;
  }

  return `Anda adalah seorang penulis skrip profesional untuk rancangan televisyen majalah "${programName}" di stesen "${station}".

${notes ? `Panduan Penulisan / Rujukan Gaya:\n${notes}\n` : ''}
Tugasan: Tulis SATU teks lontaran skrip pengacara untuk bahagian: ${sectionName}.
- Sasaran durasi bacaan: kira-kira ${seconds} saat (anggaran ${wordCount} patah perkataan).

Maklumat Episod:

${epTheme ? `- Tema Episod: ${epTheme}\n` : ''}${epLocation ? `- Lokasi Utama Episod: ${epLocation}\n` : ''}
${contextDetails}`;
}

function promptContiSceneSwitchRemark(lastRow, targetScene){
 const sc=lastRow.scene||'1';
 const sh=lastRow.shot||'1';
 const tk=lastRow.take||'1';
 dialog(`<div>
  <div class="dialog-heading">
    <div>
      <p class="eyebrow">UNRECORDED REMARKS</p>
      <h2>Scene ${esc(sc)}, Shot ${esc(sh)}, Take ${esc(tk)} has not been recorded.</h2>
    </div>
    <button type="button" data-action="close" aria-label="Close">✕</button>
  </div>
  <p style="font-size:14px;margin-bottom:18px;color:var(--muted)">How was it?</p>
  <div class="conti-rem-prompt-grid">
    <button type="button" class="conti-rem-prompt-btn is-gt" data-action="confirm-scene-switch-rem" data-id="${esc(lastRow.id)}" data-rem="GT" data-target-scene="${esc(targetScene)}">GT (Good Take)</button>

  </div>
 </div>`);
}

}

function formatProgramTitle(name){
 const clean=String(name||'Program').trim().replace(/\s+/g,' ');
 const words=clean.split(' ').filter(Boolean);
 if(words.length===1||clean.length<=15){
  const sz=clean.length<=7?'size-xl':clean.length<=11?'size-lg':'size-md';
  return `<h2 class="program-title one-line ${sz}"><span>${esc(clean)}</span></h2>`;
 }
 const splitAt=Math.floor(words.length/2);
 const line1=words.slice(0,splitAt).join(' '), line2=words.slice(splitAt).join(' ');
 const maxLen=Math.max(line1.length,line2.length);
 const sz=maxLen<=10?'size-lg':maxLen<=14?'size-md':'size-sm';
 return `<h2 class="program-title two-line ${sz}"><span>${esc(line1)}</span><span>${esc(line2)}</span></h2>`;
}
function parseTxDate(v){
 const s=String(v||'').trim();if(!s)return null;
 const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
 const d=iso?new Date(+iso[1],+iso[2]-1,+iso[3]):new Date(s);
 return Number.isNaN(d.getTime())?null:d;
}
function formatTxDate(v){const d=parseTxDate(v);return d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'}):(String(v||'').trim()||'TBA');}
// Throw script readiness for an episode. Every host section (Opening, Throws, Closing)
// must have real host text. A future per-episode script flag (scripts[ep].throwReady) overrides this.
function throwScriptReady(epNo){
 const s=p.scripts?.[epNo];if(!s)return false;
 if(typeof s.throwReady==='boolean')return s.throwReady;
 const hostSecs=s.sections.filter(x=>hostKey(x)&&hostKey(x)!=='Pr');
 return hostSecs.length>0&&hostSecs.every(x=>String(x.audio||'').trim()&&!/\[TEXT NOT ENTERED\]/.test(x.audio));
}
// Green = TX date passed (aired) · Yellow = throw script ready · Red = not ready.
function txStatusForEpisode(epNo){
 const d=parseTxDate(p.settings.txDates?.[epNo]);
 const today=new Date();today.setHours(0,0,0,0);
 if(d&&d<today)return {cls:'is-green',label:'Aired'};
 if(throwScriptReady(epNo))return {cls:'is-yellow',label:'Ready for TX'};
 return {cls:'is-red',label:'Not ready'};
}
function nextTxDisplay(){
 const today=new Date();today.setHours(0,0,0,0);
 const upcoming=Object.values(p.settings.txDates||{}).map(parseTxDate).filter(d=>d&&d>=today).sort((a,b)=>a-b)[0];
 return upcoming?formatTxDate(upcoming):(p.settings.nextTxDate?formatTxDate(p.settings.nextTxDate):'TBA');
}

function hostThrowScenesList(){const n=Math.min(12,Math.max(1,Number(p?.settings?.capsules)||3));return [...Array.from({length:n},(_,i)=>`Throw ${i+1}`),'Opening','Promo','Closing','BRoll'];}

function nextFileNumber(prev,fallback='001'){
 const s=String(prev??'').trim();
 if(!s)return String(fallback||'001');
 const m=s.match(/^(.*?)(\d+)(\D*)$/);
 if(!m)return s;
 const nextNum=String(Number(m[2])+1).padStart(m[2].length,'0');
 return `${m[1]}${nextNum}${m[3]}`;
}
function recalculateContiFileNumbers(rows){
 if(!Array.isArray(rows))return;
 const s=p?.settings||{};
 const cols=['cam1','cam2','cam3','audio'];
 const activeRows=rows.filter(r=>!r.draft);
 const baseTime=Date.now()-activeRows.length*1000;
 activeRows.forEach((r,idx)=>{
  if(!r.createdAt)r.createdAt=baseTime+idx*1000;
 });
 const sorted=[...activeRows].sort((a,b)=>(Number(a.createdAt)||0)-(Number(b.createdAt)||0));

 for(const col of cols){
  const startSetting = col==='cam1'?s.contiStartCam1:col==='cam2'?s.contiStartCam2:col==='cam3'?s.contiStartCam3:s.contiStartAudio;
  const fallback = String(startSetting||'001').trim()||'001';
  let lastVal = null;

  for(const r of sorted){
   const isOff = Boolean(r[`${col}_off`]);
   if(isOff){
    r[col] = '';
    continue;
   }
   if(r[`${col}_manual`]){
    const manualVal = String(r[col]||'').trim();
    if(manualVal){
     lastVal = manualVal;
    }
   }else{
    if(lastVal === null){
     const cur = String(r[col]||'').trim();
     r[col] = cur || fallback;
    }else{
     r[col] = nextFileNumber(lastVal, fallback);
    }
    lastVal = r[col];
   }
  }
 }
}

function nextContiTabName(dateStr,contiType,targetEp,locStr){

 }else{
  const epNum=Number(targetEp||ep||1);
  const epPrefix=`Ep ${String(epNum).padStart(2,'0')}`;

function buildContiPdfBlob(programName,sheet){

 const cols=[scW,shW,tkW,descW,...Array.from({length:cams},()=>camW),...(showAudio?[audW]:[]),remW];
 const colX=[left];for(const w of cols)colX.push(colX.at(-1)+w);
 const titleSuffix=sheet?.contiType?` — ${sheet.contiType.toUpperCase()}`:'';
 const headerTitle=`${programName||'PROGRAM'} — CONTINUITY SHEET${titleSuffix}`;
 const locPart=sheet?.location?`   |   LOCATION: ${sheet.location}`:'';
 const metaLine=sheet?.contiType==='Capsule'?`DATE: ${sheet?.date||todayShootDate()}${locPart}`:`DATE: ${sheet?.date||todayShootDate()}   |   EPISODE: ${String(sheet?.episode||1).padStart(2,'0')}${locPart}`;
 const perPage=18;
 const pages=[];for(let i=0;i<Math.max(1,rows.length);i+=perPage)pages.push(rows.slice(i,i+perPage));
 const pageStreams=pages.map((pRows,pIdx)=>{
  const ops=[];
  const text=(font,size,x,y,str)=>ops.push(`BT /${font} ${size} Tf 1 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)} Tm (${escPdf(str)}) Tj ET`);
  const rect=(x,y,w,h,fill=false,fillColor=null)=>{if(fillColor)ops.push(`${fillColor} rg ${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re B 0 0 0 rg`);else if(fill)ops.push(`0.93 0.94 0.91 rg ${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re B 0 0 0 rg`);else ops.push(`${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re S`);};
  ops.push('0.6 w 0.15 0.18 0.16 RG 0 0 0 rg');
  text('F2',15,left,552,headerTitle);
  text('F1',10,left,534,metaLine+(pages.length>1?`   |   PAGE ${pIdx+1} OF ${pages.length}`:''));
  const hTop=518,hRow1=20,hRow2=cams>1?18:0,hTotal=hRow1+hRow2,bodyTop=hTop-hTotal;
  rect(left,bodyTop,tableW,hTotal,true);
  rect(colX[0],bodyTop,scW,hTotal);text('F2',9,colX[0]+8,bodyTop+hTotal/2-3,'SCENE');
  rect(colX[1],bodyTop,shW,hTotal);text('F2',9,colX[1]+10,bodyTop+hTotal/2-3,'SHOT');
  rect(colX[2],bodyTop,tkW,hTotal);text('F2',9,colX[2]+10,bodyTop+hTotal/2-3,'TAKE');
  rect(colX[3],bodyTop,descW,hTotal);text('F2',9,colX[3]+10,bodyTop+hTotal/2-3,'DESCRIPTION');
  const vidX=colX[4],vidW=cams*camW;
  if(cams>1){
   rect(vidX,hTop-hRow1,vidW,hRow1);text('F2',9,vidX+vidW/2-16,hTop-14,'VIDEO');
   for(let c=0;c<cams;c++){rect(colX[4+c],bodyTop,camW,hRow2);text('F2',8,colX[4+c]+18,bodyTop+5,`CAM ${c+1}`);}
  }else{
   rect(vidX,bodyTop,vidW,hTotal);text('F2',9,vidX+18,bodyTop+hTotal/2-3,'VIDEO');
  }
  let nextColIdx=4+cams;
  if(showAudio){rect(colX[nextColIdx],bodyTop,audW,hTotal);text('F2',9,colX[nextColIdx]+18,bodyTop+hTotal/2-3,'AUDIO');nextColIdx++;}
  rect(colX[nextColIdx],bodyTop,remW,hTotal);text('F2',9,colX[nextColIdx]+10,bodyTop+hTotal/2-3,'REMARKS');

   for(let i=0;i<cols.length;i++)rect(colX[i],y,cols[i],rowH,isGT,isGT?greenBg:null);
   text('F2',10,colX[0]+16,y+7,String(r.scene||'1'));
   text('F2',10,colX[1]+16,y+7,String(r.shot||'1'));
   text('F1',10,colX[2]+16,y+7,String(r.take||'1'));
   text('F1',9,colX[3]+8,y+7,String(r.description||'').slice(0,52));
   for(let c=0;c<cams;c++)text('F1',9,colX[4+c]+14,y+7,r[`cam${c+1}_off`]?'—':String(r[`cam${c+1}`]||'—'));
   let ci=4+cams;
   if(showAudio){text('F1',9,colX[ci]+14,y+7,r.audio_off?'—':String(r.audio||'—'));ci++;}
   text('F2',9,colX[ci]+20,y+7,String(r.remarks||'—'));
  }
  return ops.join('\n');
 });

 const pageObjNums=pageStreams.map((_,i)=>5+i*2);
 objs.push(`2 0 obj\n<< /Type /Pages /Kids [${pageObjNums.map(n=>`${n} 0 R`).join(' ')}] /Count ${pageStreams.length} >>\nendobj`);

}

function buildQuestionsPdfBlob(programName,rec){
 const escPdf=s=>String(s||'').replace(/[^\x20-\x7E]/g,' ').replace(/([()\\])/g,'\\$1');
 const wrap=(text,max=78)=>{const out=[];for(const raw of String(text||'').split(/\r?\n/)){const words=raw.trim().split(/\s+/).filter(Boolean);if(!words.length){out.push('');continue;}let cur='';for(const w of words){if((cur+' '+w).trim().length>max){if(cur)out.push(cur);cur=w;}else cur=(cur+' '+w).trim();}if(cur)out.push(cur);}return out;};
 const guests=parseGuestRows(rec).map(g=>[g.name.trim(),g.title.trim()].filter(Boolean).join(' — ')).filter(Boolean);
 const lines=[];
 lines.push({font:'F2',size:16,lead:22,text:`${programName||'PROGRAM'} — INTERVIEW QUESTIONS`});
 lines.push({font:'F2',size:12,lead:18,text:`TOPIC: ${rec.topic||'Untitled'}`});
 if(rec.location||rec.date)lines.push({font:'F1',size:10,lead:15,text:`LOCATION: ${rec.location||'TBA'}   |   FILMING DATE: ${rec.date||'TBA'}`});
 if(guests.length)for(const g of guests)lines.push({font:'F1',size:10,lead:15,text:`GUEST: ${g}`});
 if(rec.description?.trim()){lines.push({font:'F1',size:10,lead:10,text:''});for(const l of wrap(`DESCRIPTION: ${rec.description.trim()}`,84))lines.push({font:'F1',size:10,lead:14,text:l});}
 lines.push({font:'F2',size:11,lead:22,text:'INTERVIEW QUESTIONS:'});
 const qLines=wrap(rec.questions?.trim()||'[No questions entered yet]',82);
 for(const l of qLines)lines.push({font:'F1',size:11,lead:16,text:l});
 let y=790;const ops=['BT'];
 for(const item of lines){if(y<55)break;ops.push(`/${item.font} ${item.size} Tf 1 0 0 1 48 ${y} Tm (${escPdf(item.text)}) Tj`);y-=item.lead;}
 ops.push('ET');
 const stream=ops.join('\n');
 const objs=[
  '1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj',
  '2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj',
  '3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>\nendobj',
  '4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj',
  '5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>\nendobj',
  `6 0 obj\n<< /Length ${stream.length} >>\nstream\n${stream}\nendstream\nendobj`
 ];
 let pdf='%PDF-1.4\n';const offsets=[0];
 for(const o of objs){offsets.push(pdf.length);pdf+=o+'\n';}
 const xrefPos=pdf.length;
 pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('');
 pdf+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;
 return new Blob([pdf],{type:'application/pdf'});
}

function parseQuestionsList(raw){
 if(!raw||!String(raw).trim())return [];
 let paragraphs=String(raw).trim().split(/\n\s*\n+/);
 if(paragraphs.length<=1){
  const rawLines=String(raw).trim().split('\n').map(l=>l.trim()).filter(Boolean);
  const numberedCount=rawLines.filter(l=>/^(?:(?:\d+[\.\)])|(?:Q\d+:?)|(?:Soalan\s*\d+:?))\s*/i.test(l)).length;
  if(numberedCount>1){
   paragraphs=[];
   let curr='';
   for(const l of rawLines){
    if(/^(?:(?:\d+[\.\)])|(?:Q\d+:?)|(?:Soalan\s*\d+:?))\s*/i.test(l)){
     if(curr)paragraphs.push(curr);
     curr=l;
    }else{
     curr=curr?(curr+'\n'+l):l;
    }
   }
   if(curr)paragraphs.push(curr);
  }
 }
 const questions=[];
 for(const p of paragraphs){
  const pClean=p.trim();
  if(!pClean)continue;
  const lines=pClean.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length)continue;
  lines[0]=lines[0].replace(/^(?:(?:\d+[\.\)])|(?:Q\d+:?)|(?:Soalan\s*\d+:?))\s*/i,'').trim();
  if(lines.length>1){
   lines[1]=lines[1].replace(/^(?:(?:\d+[\.\)])|(?:Q\d+:?)|(?:Soalan\s*\d+:?))\s*/i,'').trim();
  }
  const cleanedBlock=lines.join('\n');
  if(cleanedBlock)questions.push(cleanedBlock);
 }
 return questions;
}
function formatQuestionsDoubleSpaced(raw){
 const questions=parseQuestionsList(raw);
 if(!questions.length)return '';
 const formatted=[];
 for(let idx=0;idx<questions.length;idx++){
  const lines=questions[idx].split('\n');
  lines[0]=`${idx+1}. ${lines[0]}`;
  formatted.push(lines.join('\n'));
 }
 return formatted.join('\n\n');
}

async function executeRecordSave(recordId,recData,parsedEp,cap,rAI,addExtraThrow=false){
 const next=clone(p);
 const old=next.records.find(x=>x.id===recordId);
 const r={...newRecord(),...old,...recData,...rAI,id:recordId,episode:parsedEp,capsule:cap};
 next.records=next.records.filter(x=>x.id!==r.id);
 next.records.push(r);
 normalizeOptionalEpisode(next);
 if(addExtraThrow && parsedEp!==null){
  if(!Array.isArray(next.throws))next.throws=[];
  const extraThrow=newThrow(parsedEp);
  extraThrow.topic=`Throw · Capsule ${cap} (${r.topic||'Extra Story'})`;
  extraThrow.description=`Host throw specifically for additional capsule ${cap} in episode ${parsedEp}.`;
  extraThrow.date=r.date||'';
  extraThrow.location=r.location||'';
  next.throws.push(extraThrow);
 }
 validate(next);
 p=next;
}

function checkCapsuleSlotConflict(f,triggerEl){
 if(!f||f.id!=='record-form')return;
 const recId=f.dataset.id;
 const epInput=f.querySelector('[name="episode"]');
 const capSelect=f.querySelector('[name="capsule"]');
 if(!capSelect||!epInput)return;
 const capVal=String(capSelect.value||'').trim();
 const rawEp=epInput.value;
 const epVal=(rawEp===''||rawEp===null||Number.isNaN(Number(rawEp))||Number(rawEp)<=0)?null:Math.floor(Number(rawEp));
 if(!capVal||epVal===null){
  if(triggerEl)triggerEl.dataset.prevVal=triggerEl.value;
  return;
 }
 const conflicts=(p?.records||[]).filter(r=>r.id!==recId&&r.status!=='CANCELLED'&&Number(r.episode)===epVal&&String(r.capsule)===capVal);
 if(!conflicts.length){
  if(triggerEl)triggerEl.dataset.prevVal=triggerEl.value;
  return;
 }
 showCapsuleSlotWarningOverlay(f,epVal,capVal,conflicts,triggerEl);
}

function showCapsuleSlotWarningOverlay(f,epVal,capVal,conflicts,triggerEl){
 const dlg=$('#slot-warning-dialog');
 if(!dlg)return;
 const conflictListHtml=conflicts.map(c=>{
  const topic=c.topic?.trim()||'Untitled capsule';
  const guests=getRecordGuestList(c);
  const guestName=guests[0]?.name?.trim()||c.guest?.trim()||'';
  return `<div class="slot-warning-item"><div class="slot-warning-badge">Capsule ${esc(capVal)}</div><div class="slot-warning-info"><strong>${esc(topic)}</strong>${guestName?`<small>${esc(guestName)}</small>`:''}</div></div>`;
 }).join('');
 dlg.dataset.triggerName=triggerEl?.name||'capsule';
 dlg.innerHTML=`<div class="slot-warning-header"><span class="slot-warning-icon" aria-hidden="true">⚠️</span><div><p class="eyebrow" style="color:var(--green,#f4cc57);font-weight:800;margin:0 0 4px">SLOT ALREADY TAKEN</p><h3 style="margin:0;font-size:20px;font-weight:800;color:#fff">Episode ${epVal} · Capsule ${esc(capVal)}</h3></div></div><p class="slot-warning-desc">Slot <strong>Capsule ${esc(capVal)}</strong> in <strong>Episode ${epVal}</strong> is already assigned to:</p><div class="slot-warning-list">${conflictListHtml}</div><p class="slot-warning-note">Do you wish to continue? This slot will contain <strong>${conflicts.length+1} capsules</strong> for Episode ${epVal} (suitable when the episode is under-running).</p><div class="slot-warning-actions"><div class="slot-warning-btn-row"><button type="button" class="primary slot-btn-yes" data-action="confirm-slot-warning" data-add-throw="false">Yes</button><button type="button" class="primary slot-btn-throw" data-action="confirm-slot-warning" data-add-throw="true">Add Throw</button></div><button type="button" class="slot-revert-btn" data-action="revert-slot-warning">Cancel &amp; Change Slot</button></div>`;

 dlg.querySelector('.slot-btn-yes')?.focus();
}

async function extractScriptText(file){
 if(!/\.pdf$/i.test(file.name)&&file.type!=='application/pdf')return (await file.text()).replace(/\s+/g,' ').trim();
 const bytes=new Uint8Array(await file.arrayBuffer());
 const raw=new TextDecoder('latin1').decode(bytes);
 const chunks=[];
 const collect=str=>{for(const m of str.matchAll(/\(([^()\\]*(?:\\.[^()\\]*)*)\)\s*Tj|\[([^\]]*)\]\s*TJ/g)){const body=m[1]??m[2]??'';const clean=body.replace(/\\([nrtbf()\\])/g,(_,c)=>c==='n'?'\n':c==='r'?'':c==='t'?' ':c).replace(/\(([^()\\]*(?:\\.[^()\\]*)*)\)/g,'$1 ').replace(/[^\x20-\x7E\n\u00A0-\u00FF]/g,' ').trim();if(clean)chunks.push(clean);}};
 collect(raw);
 if(typeof DecompressionStream!=='undefined'){
  for(const m of raw.matchAll(/stream\r?\n([\s\S]*?)\r?\nendstream/g)){
   const s=m[1];if(s.length>500000)continue;
   const buf=new Uint8Array(s.length);for(let i=0;i<s.length;i++)buf[i]=s.charCodeAt(i)&0xff;
   for(const fmt of ['deflate','deflate-raw']){
    try{const ds=new DecompressionStream(fmt);const w=ds.writable.getWriter();w.write(buf);w.close();const out=await new Response(ds.readable).arrayBuffer();collect(new TextDecoder('latin1').decode(out));break;}catch{}
   }
  }
 }
 return chunks.join(' ').replace(/\s+/g,' ').trim();
}

function sourcePanel(provenance){
 if(!provenance)return '';

 return `<details class="source-panel"><summary>AI sources & review ${provenance.searched?'· research web':provenance.mode==='supplied-facts'?'· supplied facts only':'· search unconfirmed'}</summary>${provenance.notes?`<p>${esc(provenance.notes)}</p>`:''}${(provenance.citations||[]).filter(safe).map(c=>`<p>${esc(c.excerpt||'Fact reference')} <a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.title||c.url)} ↗</a></p>`).join('')}<small>Sources consulted by the search tool:</small><ul>${(provenance.consulted||[]).filter(safe).map(c=>`<li><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.title||c.url)}</a></li>`).join('')}</ul>${!(provenance.citations||[]).length?'<p>No external fact citations are available. Do not assume social profiles have been verified.</p>':''}<small>Text may have been edited after research. This panel is excluded from the printed script. Research and AI require a server connection and key.</small></details>`;

function syncSectionToThrow(epNo, section) {
  if (!p || !Array.isArray(p.throws) || !section) return;
  const key = hostKey(section);
  if (!key) return;

  let throwTopic = '';
  if (key === 'Op') throwTopic = 'Opening';
  else if (key === 'Pr') throwTopic = 'Promo';
  else if (key === 'Clo') throwTopic = 'Closing';
  else if (key.startsWith('T')) throwTopic = `Throw ${key.slice(1)}`;

  if (!throwTopic) return;

  let targetThrow = p.throws.find(t => Number(t.episode) === Number(epNo) && String(t.topic || '').trim().toLowerCase() === throwTopic.toLowerCase());
  
  let cleanText = String(section.audio || '').trim();
  const hostPrefix = new RegExp(`^${p.settings?.host || 'HOST'}\\s*:\\s*`, 'i');
  cleanText = cleanText.replace(hostPrefix, '').trim();

  if (targetThrow) {
    targetThrow.scriptText = cleanText;
  }
}

async function requestAI(project, options) {
  buildDraftRequest(project, options, 'validate-only');
  const apiKey = String(project.settings?.geminiApiKey || safeStorage.getItem('rs:gemini_api_key') || DEFAULT_GEMINI_KEY).trim();
  if (!apiKey) throw new Error('Google Gemini API Key is required. Please check your API key in Settings.');

  const prompt = buildGeminiPrompt(project, options);
  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${encodeURIComponent(apiKey)}`;

  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{
        parts: [{ text: prompt }]
      }],
      generationConfig: {
        temperature: 0.7,
        maxOutputTokens: 2048
      }
    })
  });

  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const msg = data?.error?.message || `Gemini API returned status ${res.status}`;
    if (res.status === 400 && msg.includes('API key')) throw new Error('Invalid Gemini API Key. Please verify in Settings.');
    if (res.status === 429) throw new Error('Gemini API quota reached. Please wait a moment and try again.');
    throw new Error(`AI error: ${msg}`);
  }

  let text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
  text = text.trim();
  if (!text) throw new Error('AI returned no text. Try again or write manually.');

  // Clean any markdown or quotes or host prefix
  text = text.replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/i, '').trim();
  const hostPrefix = new RegExp(`^${project.settings?.host || 'HOST'}\\s*:\\s*`, 'i');
  text = text.replace(hostPrefix, '').trim();

  if (options.target === 'questions') {
    text = formatQuestionsDoubleSpaced(text);
  }

  return {
    text: text,
    provenance: {
      generatedAt: new Date().toISOString(),
      model: 'gemini-3.5-flash-lite',
      tone: options.tone || project.settings?.tone
    }
  };
}

 try{

? Ada tak momen comel atau kenangan manis yang adik selalu ingat bersama mereka?\n\nPada usia 14 tahun, kawan-kawan lain mungkin banyak masa bermain. Adik pula melihat perjuangan Ibu dan Ayah setiap hari. Pernah tak adik rasa sedih atau terkesan dengan situasi ini?\n\nDi mata adik, siapakah Ibu dan Ayah? Apa pengorbanan mereka yang paling membuatkan adik rasa kagum dan sayang pada mereka?\n\nApa impian atau cita-cita adik sendiri bila dah besar nanti? Dan apa janji adik untuk Ibu, Ayah, dan adik-adik?\n\n\nAYAH (Answer Qs: 8)\nApa pesanan atau ucapan yang ingin Encik sampaikan kepada Puan Waheeda yang mungkin jarang-jarang dapat diucapkan dalam kesibukan harian?\n\n\nIBU (Answer Qs: 7 & 8)\nSepanjang fasa ujian ini, apa perkara paling bermakna yang Puan belajar tentang erti menjadi seorang ibu?\n\nApa doa terbesar Puan untuk masa depan anak-anak dan keluarga Puan?", "vo": "bla bla bla bla bla bla\n\n\nSTAFF:\n“Hello Anggun, sekarang saya tengah mengadun adunan kek kita hari ini”\n\n\n\n\n\n\n\n“Sekarang kita nak angkat keluar kek yang telah siap dibakar”\n\n“Haaa.. kek memang kita buat. Kek memang kita buat”\n\n\n\n\n\n\n\n“kek-kek ini akan disediakan sebelum kelas deko kita mula”\n\n“Students/clients akan diajar cara untuk masukkan frosting kita dalam piping nanti”", "remarks": "", "profile": ""}, {"id": "rec-anggun-2", "episode": 3, "capsule": "2", "type": "Interview", "topic": "Gajah Oleng P1", "description": "Busana pengantin tradisi sarawak di KL", "guest": "Danny Zulkifli", "title": "Pereka fesyen tradisional", "location": "KCH", "date": "2026-05-26", "status": "TX", "duration": "", "questions": "Perkenalkan diri.\n\nSelepas sekian lama pelaminan kita didominasi oleh gaun pengantin gaya Barat, apa pendapat Abang Danny tentang kesedaran generasi muda hari ini yang kembali mengangkat identiti budaya sendiri?\n\nMengapa busana tradisional seperti Gajah Oleng ini mempunyai 'tarikan' atau aura yang tersendiri berbanding pakaian moden apabila disarungkan di hari bahagia?\n\nHuraikan, apa sebenarnya busana \"Gajah Oleng\" ini? Apakah keunikan dan sejarah di sebalik nama yang cukup unik ini?\n\nRamai yang keliru antara busana Keringkam dan Gajah Oleng. Boleh Abang Danny jelaskan apa perbezaan ketara antara kedua-duanya, dari segi material, potongan, mahupun cara pemakaiannya?\n\nKami tahu busana keringkam hasil tangan Abang Danny sering dinilai dengan harga yang sangat eksklusif. Apa yang membuatkan proses pembuatan busana-busana tradisi Sarawak ini begitu bernilai tinggi dan memakan masa?\n\n\nB-Roll Interview questions:\nBoleh kongsikan dan tunjukkan, bagaimana proses penyediaan, penjagaan, dan penyimpanan busana eksklusif ini untuk dibawa travel nait belon? Ada tak sebarang pantang-larang atau teknik lipatan khas supaya sulaman benang emas atau aksesori busana ini tidak rosak sepanjang perjalanan?\n\nApa perasaan apabila memegang tanggungjawab memastikan busana rare ini sampai dalam keadaan baik di KL nanti?\n\nSebagai seorang guru seni keringkam dan pelopor busana tradisional, apakah harapan Abang Danny melihat kelestarian pakaian warisan Sarawak ini dalam industri perkahwinan masa hadapan?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-3", "episode": 4, "capsule": "4", "type": "Interview", "topic": "Jom Travel", "description": "Kisah tertubuhnya Jom Travel", "guest": "Amira Abd Hamid", "title": "Pengasas Jom Travel & AromaLab", "location": "KCH", "date": "2026-05-26", "status": "TX", "duration": "", "questions": "Perkenalkan diri anda\n\nPuan Amira, anda bermula dengan agensi pelancongan Jom Travel and Tour. Boleh kongsikan bagaimana minat dalam dunia pengembaraan akhirnya membuka pintu kepada penubuhan Aroma Lab?\n\nSemasa mengembara ke Eropah, Indonesia, dan Dubai, anda banyak meneliti budaya wangian di sana. Apakah perbezaan ketara yang anda nampak, dan bagaimanakah pengalaman itu membentuk customer experience yang anda bawakan hari ini?\n\nSebagai usahawan wanita yang aktif dalam industri travel & lifestyle, bagaimana anda melihat kaitan antara \"mengembara\" dengan \"memilih bau wangian personal\"?\n\nBoleh terangkan apa yang dimaksudkan dengan konsep \"interactive perfume mixing\" ini untuk pelanggan yang pertama kali datang?\n\nIndustri wangian sangat kompetitif, namun anda memilih untuk fokus kepada \"personal identity through fragrance\". Kenapa penting untuk seseorang itu mempunyai bau minyak wangi yang direka khas oleh diri mereka sendiri?\n\nBagaimana anda mengimbangi antara kualiti premium ini dengan positioning jenama yang \"accessible\" (mampu milik) untuk pasaran tempatan?\n\nMengikut perancangan asal, anda mahu membuka cawangan pertama di Kuala Lumpur, tetapi akhirnya memilih Kuching. Selain faktor kos dan praktikaliti, apa sentimen peribadi anda terhadap pasaran tempatan Sarawak?\n\nDari kembara, ke buat travel agency, melompat pula ke dunia wangian, what’s next for you?\n\nSebagai seorang ikon usahawan wanita moden, apa pesanan atau harapan anda kepada wanita di luar sana yang ingin menceburi bidang lifestyle business yang kreatif seperti ini?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-4", "episode": 5, "capsule": "2", "type": "Interview", "topic": "Sugar&Berries", "description": "Dokorasi kek di Sanggar Manisan", "guest": "Ajibah Muhammad", "title": "", "location": "KCH", "date": "2026-06-14", "status": "TX", "duration": "", "questions": "Perkenalkan diri anda.\n\nBoleh jelaskan apa itu Sugar & Berries dan apa keistimewaannya?\n\nBoleh kongsi sedikit bagaimana tercetusnya idea untuk menubuhkan Sugar & Berries dan menawarkan kelas mendekorasi kek?\n\nKami difahamkan kelas ini sangat popular dalam kalangan pasangan (couples), sahabat baik (besties), serta mother daughters. Mengapa aktiviti mendekorasi kek ini menjadi platform yang bagus untuk meluangkan masa bersama?\n\nBagi mereka yang langsung tiada asas memasak atau membakar (baking), adakah mereka masih boleh menyertai kelas Sugar & Berries ini? \n\nApa yang bakal mereka pelajari dalam masa beberapa jam di sini?Sepanjang mpengalaman Sugar & Berries, apakah kenangan yang paling tidak dapat dilupakan? Seperti pengalaman ada student yang kini bergelar cake decorator, atau lain2.\n\nMelihat kepada sambutan yang menggalakkan, bagaimana anda melihat potensi aktiviti seperti dekorasi kek ini sebagai trend gaya hidup (lifestyle) moden di Sarawak, khususnya di Kuching?\n\nAkhir sekali, bagi mereka yang ingin merasai sendiri pengalaman mendekorasi kek bersama orang tersayang disini, bagaimana cara untuk mereka mendaftar atau mengikuti perkembangan kelas akan datang?", "vo": "bla bla bla bla bla bla\n\n\nSTAFF:\n“Hello Anggun, sekarang saya tengah mengadun adunan kek kita hari ini”\n\n“Sekarang kita nak angkat keluar kek yang telah siap dibakar”\n\n“Haaa.. kek memang kita buat. Kek memang kita buat”\n\n“kek-kek ini akan disediakan sebelum kelas deko kita mula”\n\n“Students/clients akan diajar cara untuk masukkan frosting kita dalam piping nanti”", "remarks": "", "profile": ""}, {"id": "rec-anggun-5", "episode": 5, "capsule": "3", "type": "Interview", "topic": "My Palette Studio", "description": "Warnah wajah anda.", "guest": "", "title": "", "location": "KL", "date": "2026-06-25", "status": "TX", "duration": "", "questions": "Untuk penonton ANGGUN yang pertama kali mendengar tentang konsep ini, boleh jelaskan secara ringkas, apa sebenarnya yang dimaksudkan dengan Personal Color Analysis.\n\nMengapa warna baju yang kita pakai boleh mempengaruhi seri wajah seseorang?\n\nApakah kesilapan paling biasa yang wanita lakukan dalam pemilihan warna fesyen mereka?\n\nBoleh tunjukkan kepada kami bagaimana proses menganalisis warna kulit ini dilakukan di My Palette Studio? (Warm Tone dan Cool Tone explanation here more)\n\nSelepas seseorang itu tahu \"warna\" mereka bagaimanakah mereka boleh aplikasikan ilmu ini dalam pemilihan mekap harian dan juga wardrobe pakaian kerja?\n\nApakah tips paling mudah untuk wanita di luar sana membuat ujian warna kulit sendiri di rumah sebelum keluar membeli-belah?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-6", "episode": 3, "capsule": "4", "type": "Interview", "topic": "Sarini Zainal", "description": "Kisah perjalanan kena tinggal masa IV", "guest": "Sarini Zainal", "title": "Pemilik The Pastel Shop", "location": "KL", "date": "2026-06-25", "status": "TX", "duration": "", "questions": "Perkenalkan diri.\n\nKisah puan pernah tular di medsos, boleh bawa kami kembali ke momen tersebut—apakah sebenarnya kisah unik atau pengajaran terbesar di sebalik proses temuduga yang tular itu?\n\nBerdasarkan pengalaman hidup puan sendiri, bagaimana puan menguruskan emosi semasa mengalami kegagalan?\n\nPada pendapat puan, apakah kriteria utama yang puan rasa perlu ada pada seseorang wanita untuk menonjolkan diri semasa berdepan dengan panel penemu bual?\n\nSepanjang perjalanan turun naik kehidupan dan kerjaya puan, siapakah sistem sokongan terbesar yang sentiasa mempercayai bakat puan walaupun ketika puan sendiri rasa ragu-ragu?\n\nUntuk penonton-penonton ANGGUN yang baru nak melangkah ke dunia pekerjaan, apakah nasihat yang puan kongskan?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-7", "episode": 5, "capsule": "5", "type": "Interview", "topic": "Tender Hearts Cafe", "description": "Operasi cafe oleh anak-anak down syndrome", "guest": "", "title": "", "location": "KL", "date": "2026-06-26", "status": "TX", "duration": "", "questions": "Perkenalkan diri.\n\nBoleh kongsikan impian awal di sebalik penubuhan Tender Hearts Cafe ini? Mengapa memilih untuk menyediakan platform pekerjaan dan latihan khusus buat anak-anak istimewa ini?\n\nApakah kelainan atau keunikan menu dan layanan yang dijanjikan disini?\n\nMenguruskan sebuah kafe dengan kru yang terdiri daripada anak-anak istimewa ini pastinya menuntut kesabaran yang tinggi. Boleh kongsikan satu momen paling menyentuh hati atau mencuit hati yang pernah berlaku sepanjang mengendalikan mereka di sini?\n\nBagaimana penerimaan dan sokongan masyarakat setakat ini? Adakah mereka datang sekadar menyokong social cause ini, atau memang kerana kualiti makanan dan kopi di sini?\n\nApakah harapan terbesar anda buat anak-anak di Tender Hearts ini untuk jangka masa panjang? Apa mesej yang ingin disampaikan kepada majikan di luar sana tentang keupayaan anak-anak istimewa ini?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-8", "episode": 3, "capsule": "5", "type": "Interview", "topic": "Lipstick Diary", "description": "Lifestyle. Customize lipstick ikut warna yg anda mahu bersama Lipstick Diary.", "guest": "", "title": "", "location": "KL", "date": "2026-06-26", "status": "TX", "duration": "", "questions": "Konsep mencipta warna gincu sendiri (customise lipstick) ini sesuatu yang sangat interaktif. Boleh ceritakan bagaimana proses dari awal sehingga sebatang gincu itu siap?\n\nSetiap wanita mempunyai warna bibir yang berbeza. Bagaimana Lipstick Diary membantu pelanggan mencari formula atau ton warna gincu yang sesuai dengan tekstur dan warna bibir mereka?\n\nSelain daripada warna, adakah pelanggan juga boleh memilih sendiri tekstur gincu mereka\n\nAdakah bahan-bahan yang digunakan di sini mesra kulit?\n\nDari sudut pandang trend fesyen dan kecantikan masa kini, mengapa memiliki sebatang gincu yang direka khas custom made dianggap sebagai satu kemewahan dan kepuasan tersendiri buat seorang wanita?\n\nBoleh berikan tips bagaimana untuk mengekalkan warna gincu supaya tahan lebih lama dan bibir tidak nampak merekah, terutamanya untuk wanita bekerjaya yang sibuk seharian?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-9", "episode": 3, "capsule": "3", "type": "Interview", "topic": "Gajah Oleng P2", "description": "Kesinambungan dari Gajah Oleng P1, dalam sebuah majlis perkahwinan.", "guest": "", "title": "", "location": "KL", "date": "2026-06-27", "status": "TX", "duration": "", "questions": "PENGANTIN\nPerkenalkan diri (both pengantin)Selain Gajah Oleng, apakah persediaan lain yang turut dibawakan dari Sarawak ke sini? Atau simply apakah persediaan sebelum mengacara majlis gilang-gemilang ini?\n\nMengapa anda memilih untuk membawa identiti Sarawak, Gajah Oleng di hari bahagia anda di KL?\n\nOrang Sarawak sendiri pun jarang sekali dapat melihat atau menggayakan busana Gajah Oleng ini. Apakah perasaan anda sewaktu pertama kali menyarungkan busana dan perhiasan kepala ini?\n\nBagaimanakah reaksi keluarga pasangan dan juga para tetamu di KL apabila melihat anda melangkah masuk ke dewan dengan busana warisan yang begitu eksklusif ini? - pengantin lelaki if can.\n\nBaiklah, pengantin perempuannya, Sarawak dan pengantin lelaki dari Negeri Sembilan, ceritakan secara ringkas tentang bibit pertama pertemuan anda?\n\n\nIBU BAPA PENGANTIN\nSebagai ibu bapa pengantin, apakah perasaan melihat anak mengambil inisiatif untuk mengekalkan tradisi nenek moyang dalam majlis yang serba moden di KL ini?\n\nBukan hanya busana tradisi Sarawak yang ditampilkan, tapi juga adat perkahwinan seperti Nasi Temuan juga diadakan. Menurut Pengantin, ini adalah idea dari ibu pengantin sendiri, mengapakah adat ini istimewa bagi Puan?\n\nIkan di laut, asam di darat. Bak kata orang lama, ‘Nikah Merantau’. Turut difahamkan Tuan dan Puan juga Nikah Merantau, menjadi inspirasi kepada pengantin kita hari ini. Bagi pasangan yang telah berpuluh tahun merasai sendiri, apakah keistimewaan atau kelebihan Nikah Merantau ni?\n\n\nABANG DANNY (Optional)\nApakah perasaan Abang Danny apabila melihat busana ini akhirnya tersarung di KL hari ini selepas bertungkus-lumus menyiapkan dan menghantar busana ini dari Kuching ke KL?\n\nApakah harapan Abang untuk Gajah Oleng?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-10", "episode": 1, "capsule": "1", "type": "Interview", "topic": "Couple's intro", "description": "12 mins", "guest": "", "title": "", "location": "KL", "date": "2026-07-08", "status": "TX", "duration": "12:00", "questions": "1. Family’s Perspective (Mom & Azza)\nQuestion 1: Jika diminta menggambarkan Dato’ Amin dalam tiga perkataan? (00:00:16 - 00:00:28) \n\n2. Best Friend’s Perspective (Yaz)\nQuestion 1: Boleh kenalkan diri & berapa lama berkawan baik dengan Dr. Amin? (00:00:24 - 00:00:57)\nQuestion 2: Apa personaliti Dr. Amin yang mungkin tak ramai orang tahu? (00:01:02 - 00:01:48)\n\n3. Muna’s parents\nQuestion 1: When they first noticed Muna and Amin getting close / Dr. Amin asking for permission: (00:04:24 - 00:05:54)\n\n4. Groom’s Self-Introduction (Dr. Amin)\nQuestion 1: Boleh perkenalkan diri dulu. (00:00:16 - 00:00:36)\n\n5. Muna’s Parents (Tan Sri Effendi & Tengku)\nQuestion / Topic: Apa perubahan Muna selepas kenal Amin? (00:06:09 - 00:07:14) …. This guy is well brought up…\n\n6. Natasha (Bride’s Bestie)\nQuestion / Topic: Reaksi pertama bila tahu Muna hendak berkahwin & pendapat tentang Dr. Amin (00:02:15 - 00:03:40)\n\n7. Groom's Perspective (Dr. Amin)\nQuestion / Topic: Apa yang paling menarik perhatian doktor semasa mengenali Puteri Munawarah? (00:02:26 - 00:03:42)\n\n8. Groom's Family Perspective (Mom & Azza)\nQuestion 1: Who Amin opened up to first / First impression of Muna? (00:06:38 - 00:08:20)\nQuestion 2: Apa perasaan adik (Azza) demi abang ni sekarang? (00:08:39 - 00:09:39)\n\n9. Bride’s reveal (Puteri Muna)\nQuestion 1: Perkenalkan diri (00:00:22 - 00:00:50)\nQuestion 3: What is your first impression? (00:02:06 - 00:02:37)\n\n10. Groom’s Account (Dr. Amin)\nQuestion 2: Boleh ceritakan bagaimana Amin Doktor mula mengenali Puteri Munawarah? (00:00:44 - 00:02:17)\n\n11. Bride’s Account (Puteri Muna)\nQuestion 2:  So boleh kongsikan bagaimana perkenalan pertama dengan Dr. Amin? (00:01:00 - 00:02:00)\n", "vo": "Anak jati bumi Kenyalang, berasal dari Miri ini pastinya memiliki pesona tersendiri. Mana tidaknya, gerangan budiman inilah yang berjaya memaut hati sang puteri, membibitkan sebuah kisah cinta merentasi negeri. Apa kata, bersama ANGGUN, kita kenali DR. AMIN AZNIZAN dengan lebih dekat. Siapa agaknya lelaki bertuah pilihan sang puteri?\n\nMOM & AZZA:\nSerious. Oh my God. That-- I thought the same. The same. Yeah. Only one word. Serious. \n\n+ (0:00:32 - 00:01:03) \nUm, err, daripada kecil, Amin was never the playful type. He was always very serious. And, err, nya sik berolah pun Amin has always been a well behaved child. I mean he is playful. But he's playful in a, in a quiet way. In a serious way. \n\nYAZ:\n(00:00:24 - 00:00:38)\nNama saya Muhammad Fazli Yazid bin Bohri atau lebih dikenali sebagai Yaz lah, uh, dalam kalangan kawan-kawan. Dr. Amin pun panggil saya Yaz\n\n(00:01:02 - 00:01:48)\naura mungkin ada anggap dia macam sombong. Tapi sebenarnya tidak. Uh, lagi satu, um, kalau dia dah, uh, maksudnya kalau dia suka ataupun dia dah, uh, kira macam, uh, ngam lah dengan orang tu, insyaAllah dia, kita akan lebih tahu lebih, uh, lagi mendalam macam mana karakter dia tu. Dia seorang yang baiklah. Dia memang seorang yang baik. Memang, uh, seorang provider tak kisah kepada kawan-kawan baik dia, and then apatah lagi keluarga lah. Hmm. \n\n\nTAN SRI AFFENDI & TENGKU:\n(00:04:24 - 00:05:54)\nSo from there on and things started to get serious and one day Amin came- Came to see us ...to the, to the house for dinner. He se-specially asked for dinner- Permission ...with us. So- Asking permission- Uh ... to continue and go to the next level of the relationship. Yeah. That is absolutely, uh, what do you call it? Um, non-existent in our- In today's ...culture. Mana ada. Ada tak si laki tu nak datang dating mintak permission. Si ada kan? Ah. So- That's, that is something else. So this guy got adab. This guy been brought up well. \n\nDR AMIN:\n\nTAN SRI AFFENDI & TENGKU:\n\nNATASYA:\n\nDR AMIN:\n\nMYA (VO):\nKata demi kata, bersulam sinar mata penuh kejujuran tatkala berbicara tentang Puteri Muna, bukti sebuah cinta yang kian mekar mengharum. Pengantin lelaki sudah kita kenali, kini giliran sang puteri pula menjadi tumpuan di persada pelaminan. Apa pula persepsi keluarga DR. AMIN terhadap YM Dato’ Indera PUTERI MUNAWARAH?\n\nMOM & AZZA:\n\nPUTERI MUNA:\n\nDR AMIN:\n\nPUTERI MUNA:\n\n", "remarks": "", "profile": ""}, {"id": "rec-anggun-11", "episode": 1, "capsule": "2", "type": "Interview", "topic": "Wedding Preperation + Pertunangan + Akad Nikah", "description": "10 mins", "guest": "", "title": "", "location": "KL", "date": "2026-07-08", "status": "TX", "duration": "10:00", "questions": "wedding prep, akad & perasaan dah kahwin\n\n1. Wedding Prep: Bride’s Perspective (Puteri Muna)\nQuestion: Persiapan perkahwinan / Planning the wedding? (00:07:28 - 00:08:30)\n\n2. Wedding Prep: Reka Timor\nQuestion: all\n\nAKAD NIKAH\n\n3. B&G feelings when was asked to get married.\nBride: Apa perasaan di tekan-tekan nak kahwin (00:04:41 - 00:05:32)\nGroom: Indulge us with the proposal Story. (00:08:08 - 00:10:46)\n\n4. Groom’s feelings before akad.\nApa yang bermain di fikiran sebelum dah nak akad malam ni? (00:11:02 - 00:12:18)", "vo": "Segalanya bermula apabila dua jiwa memasang niat untuk melangkah ke gerbang abadi. Laksana sebuah hikayat, perjalanan ini disusuli dengan sebuah majlis pertunangan yang diadakan secara eksklusif dan penuh tertutup.\n\nBertempat di sebuah pusat peranginan indah di Janda Baik, Pahang, beberapa bulan sebelum hari bahagia, majlis disempurnakan dalam suasana akrab. Ia turut dihadiri oleh ahli keluarga terdekat bagi memuliakan hasrat suci DR. AMIN meminang PUTERI MUNAWARAH.\n\n\n\n\nSetiap ikatan yang murni pasti bermula dengan restu orang tua. Dari detik itulah, bermulalah lembaran persiapan demi menyempurnakan hari yang dinanti-nantikan.\n\n\nPUTERI MUNA:\n\nREKA TIMOR:\n\n\nMajlis persandingan yang dapat anda lihat sekilas pandang itu tadi direka khas buat perkahwinan antara YM Dato’ Indera Puteri Munawarah Syammiyah binti Dato’ Munir & Dr. Amin Aznizan oleh REKA TIMOR. \n\nNamun sebelum itu, mari kita singah ke majlis Akad nikah yang dibuat sebelum majlis resepsi di-Raja ini. \n\n\nMaka, berakhirlah detik penantian apabila kedua-dua mempelai disatukan dalam sebuah majlis akad nikah yang penuh ketulusan. Pasangan rupawan ini tampil anggun dan segak mengenakan busana berona off-white, hasil sentuhan magis pereka fesyen tersohor, Rizalman, yang membangkitkan seri raja sehari.\n\nHantaran sepuluh berbalas sepuluh, seiring adat penyeri majlis...\n\nSOUNDBYTE:\nAku terima Nikahnya ......\n\n\n", "remarks": "", "profile": ""}, {"id": "rec-anggun-12", "episode": 1, "capsule": "3", "type": "Interview", "topic": "KL Reception", "description": "9 mins", "guest": "", "title": "", "location": "KL", "date": "2026-07-08", "status": "TX", "duration": "09:00", "questions": "", "vo": "Syukur ke hadrat Ilahi, dengan sekali lafaz, YM DATO’ INDERA PUTERI MUNAWARAH SYAMMIYAH sah bergelar isteri kepada DR. AMIN AZNIZAN. Detik penuh bermakna ini turut disaksikan oleh KDPB Sultan Pahang, Al-Sultan Abdullah Ri’ayatuddin Al-Mustafa Billah Shah, bersama KDPB Tengku Ampuan Pahang, Tunku Azizah Aminah Maimunah Iskandariah, yang berangkat menyerikan majlis akad nikah.\n\nDan kini... tibalah detik yang paling ditunggu-tunggu. Puncak segala kemegahan, Majlis Resepsi Diraja!\n\nMajlis persandingan megah di Hotel Shangri-La, Kuala Lumpur ini diserikan dengan pelamin indah bertemakan Dinasti Parsi, sebuah karya seni agung daripada Rekateemor yang memukau pandangan mata.\n\nKehadiran duli-duli tuanku serta barisan VVIP, tidak dilupakan rakan-rakan selebriti tanah air, turut sama memeriahkan suasana bagi merai dan merestui penyatuan dua jiwa ini.\n\nSebuah malam yang menyatukan cinta, adat, dan warisan terakam indah sebagai kenangan sepanjang hayat.", "remarks": "", "profile": ""}, {"id": "rec-anggun-13", "episode": 1, "capsule": "4", "type": "Interview", "topic": "Kuching Reception", "description": "10 mins", "guest": "", "title": "", "location": "KL", "date": "2026-07-08", "status": "TX", "duration": "10:00", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-14", "episode": 4, "capsule": "2",
