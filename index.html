body,p,input,select,textarea{font-family:var(--font-sans);font-weight:400}
label,.nav-link,.stat span,.host-badge,.project-picker select,.toolbar>select{font-weight:500}
button,.primary,.light,.welcome-project-open,h3,.capsule-card h3,.record-main strong,.structure-item strong,.top-project,.brand,.nav-link.active{font-weight:600}
h1,.page-heading h1,.hero h2,.dialog-heading h2,.section-title h2,.panel h2,.pill,.eyebrow,.status,.host-badge b,.host-avatar{font-weight:700}
.welcome h1,.stat strong,.toolbar-summary b,.capsule-number,.record-key b,.section-index{font-weight:800;font-variation-settings:'wght' 800,'opsz' 48}
.brand-mark{font-family:var(--font-sans);font-weight:900;font-variation-settings:'wght' 900,'opsz' 72}
.home-stack{display:flex;flex-direction:column;gap:16px}
.home-stack>*{margin:0!important}
.home-station-badge{display:block;font-family:var(--font-sans);font-size:clamp(16px,2.2vw,20px);font-weight:700;font-variation-settings:'wght' 700,'opsz' 32;letter-spacing:2.5px;text-transform:uppercase;color:var(--green);margin-bottom:-2px}
.home-hero{display:flex;flex-direction:column;justify-content:center;text-align:center;padding:36px 24px 20px;position:relative}
.home-identity{display:flex;flex-direction:column;align-items:center;text-align:center;width:92%;max-width:960px;margin:0 auto;gap:10px}
.home-identity-pill{white-space:nowrap;font-size:clamp(8px,2.2vw,10px)!important;letter-spacing:clamp(.6px,.26vw,1.4px)!important;padding:5px 11px!important;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.program-title{margin:0 0 2px!important;width:100%;font-family:var(--font-sans)!important;font-weight:800!important;font-variation-settings:'wght' 800,'opsz' 72;letter-spacing:-.035em;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.program-title span{display:block;font-weight:800;font-variation-settings:'wght' 800,'opsz' 72}
.program-title.size-xl{font-size:clamp(62px,9.6vw,108px);line-height:.98}
.program-title.size-lg{font-size:clamp(52px,7.8vw,90px);line-height:1.02}
.program-title.size-md{font-size:clamp(44px,6.4vw,74px);line-height:1.04}
.program-title.size-sm{font-size:clamp(36px,5.2vw,62px);line-height:1.06;gap:2px}
.home-hero p{max-width:520px;margin:0 auto 2px;font-weight:400}
.home-people-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.host-badge{display:inline-flex;align-items:center;gap:10px;background:#ffffff12;border:1px solid #ffffff22;padding:6px 14px 6px 6px;border-radius:999px;margin:0;font-size:12px;color:#f6f9eb;min-height:0}
.writer-badge{cursor:pointer;transition:border-color .15s,background .15s}
.writer-badge:hover{border-color:var(--green);background:#f4cc571a}
.host-avatar{width:28px;height:28px;border-radius:50%;background:var(--lime);color:#163d30;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;font-weight:700;font-size:12px;flex-shrink:0}
.writer-avatar{background:#32323a;color:#f4cc57}
.home-hero-footer{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:960px;margin:22px auto 0}
.home-hero-footer .home-identity-pill{margin:0!important}
.hero-gear-btn{width:38px!important;height:38px!important;min-width:38px!important;min-height:38px!important;padding:0!important;border-radius:10px!important;border:1px solid #ffffff22!important;background:#ffffff10!important;color:#d6d6df!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;transition:border-color .15s,background .15s,color .15s,transform .15s;flex-shrink:0}
.hero-gear-btn:hover{border-color:var(--green)!important;background:#f4cc571a!important;color:var(--green)!important;transform:rotate(25deg)}
@media(max-width:480px){.home-hero{padding:28px 16px 16px}.home-identity{width:100%}.home-hero-footer{margin-top:16px}.hero-gear-btn{width:36px!important;height:36px!important;min-width:36px!important;min-height:36px!important}}
.tx-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:0;text-align:center;transition:border-color .18s,background .18s;overflow:hidden}
.tx-card:hover{border-color:#f4cc5766}
.tx-card>summary{list-style:none;cursor:pointer;padding:22px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;user-select:none}
.tx-card>summary::-webkit-details-marker{display:none}
.tx-card .eyebrow{letter-spacing:2px;color:var(--green)}
.tx-card strong{font-size:clamp(28px,4vw,38px);font-weight:800;letter-spacing:-.03em;color:var(--ink);line-height:1.1}
.tx-card small{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.tx-card[open]>summary{padding-bottom:16px}
.tx-schedule-wrap{padding:4px 20px 22px;max-width:680px;margin:0 auto;width:100%}
.tx-table{width:100%;border-collapse:separate;border-spacing:0 6px;text-align:left;font-size:13px}
.tx-table td:last-child{text-align:right;width:44px}
.tx-table td:nth-child(2){text-align:center}
.tx-table tbody tr{background:#ffffff06;transition:background .15s}
.tx-table tbody tr:nth-child(even){background:#f4cc5709}
.tx-table tbody tr:hover{background:#f4cc5716}
.tx-table td{padding:8px 14px;border:0;color:var(--ink);font-weight:500;vertical-align:middle}
.tx-table td:first-child{border-radius:10px 0 0 10px;font-weight:700;color:var(--green);letter-spacing:.5px;white-space:nowrap;width:72px}
.tx-table td:last-child{border-radius:0 10px 10px 0}
.tx-date-input{width:100%;min-height:34px;padding:6px 10px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink);font-size:13px;font-weight:500;text-align:center}
.tx-date-input::placeholder{color:var(--muted)}
.tx-date-input:focus{background:var(--bg);border-color:var(--line);outline:none}
.tx-status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;vertical-align:middle}
.tx-status-dot.is-green{background:#48c774;box-shadow:0 0 0 3px #48c77424}
.tx-status-dot.is-yellow{background:#f4cc57;box-shadow:0 0 0 3px #f4cc5726}
.tx-status-dot.is-red{background:#f06548;box-shadow:0 0 0 3px #f0654824}
.tx-remark{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;padding:5px 10px;border-radius:999px;text-transform:uppercase}
.tx-remark.is-aired{background:#24392e;color:#b3ddbe}
.tx-remark.is-ready{background:#f4cc57;color:#201a09}
.tx-remark.is-script{background:#f4cc5722;color:#ffda69}
.tx-remark.is-capsule{background:#25343f;color:#bbd8ed}
.tx-remark.is-not-ready{background:#ffffff0c;color:#9d9da8}
.capsule-boxes-stack{display:flex;flex-direction:column;gap:16px;margin-top:8px}
.quick-record-fields{display:flex;flex-direction:column;gap:16px}
.quick-record-fields input,.quick-record-fields textarea{background:var(--bg);border-color:var(--line)}
.capsule-overview-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:8px}
.capsule-overview-top .eyebrow{margin:0}
.capsule-overview-top button{border:0;background:transparent;padding:7px;min-width:40px}
.capsule-overview-display{padding:2px 0 20px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.capsule-overview-title{font-family:var(--font-sans);font-size:clamp(26px,3.8vw,34px);font-weight:800;font-variation-settings:'wght' 800,'opsz' 48;letter-spacing:-.025em;line-height:1.12;color:#fff;margin:0 0 10px}
.capsule-overview-desc{font-size:14px;line-height:1.65;color:#c7c7d1;margin:0 0 16px;max-width:650px;white-space:pre-wrap}
.capsule-overview-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.capsule-overview-meta .pill{font-size:10px;letter-spacing:1.4px;padding:7px 13px;background:#ffffff10;border:1px solid #ffffff22;color:var(--ink);text-transform:uppercase}
.capsule-edit-btn{min-height:36px;padding:7px 16px;font-size:12px;font-weight:600;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.capsule-edit-btn:hover{border-color:var(--green);color:var(--green)}
.capsule-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.capsule-box[hidden],.capsule-overview-display[hidden]{display:none!important}
.capsule-box h2{margin:0;font-size:18px;font-weight:700;color:var(--ink)}
.capsule-collapsible{padding:0;display:block;transition:border-color .18s,background .18s;overflow:hidden}
.capsule-collapsible:hover{border-color:#f4cc5766}
.capsule-collapsible>summary{list-style:none;cursor:pointer;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;user-select:none}
.capsule-collapsible>summary::-webkit-details-marker{display:none}
.capsule-collapsible>summary h2{margin:0;font-size:18px;font-weight:700;color:var(--ink)}
.capsule-collapsible>summary span{font-size:12px;color:var(--muted);transition:transform .18s}
.capsule-collapsible[open]>summary{padding-bottom:14px;border-bottom:1px solid var(--line)}
.capsule-collapsible[open]>summary span{transform:rotate(180deg);color:var(--green)}
.capsule-collapsible-body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:16px}
.guests-wrap{display:flex;flex-direction:column;gap:10px}
.guests-list{display:flex;flex-direction:column;gap:12px}

.capsule-guests-question-list{display:flex;flex-direction:column;gap:10px}
.guest-question-card{width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .16s,background .16s,transform .12s}
.guest-question-card:hover{border-color:var(--green);background:#f4cc570a;transform:translateY(-1px)}
.guest-q-badge{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#f4cc5722;color:var(--green);font-size:14px;font-weight:800;flex-shrink:0}
.guest-q-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.guest-q-info strong{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guest-q-info small{font-size:12.5px;color:var(--muted)}
.guest-q-count{color:var(--green);font-weight:600}
.guest-q-chevron{font-size:20px;color:var(--muted);flex-shrink:0;transition:transform .15s}
.guest-question-card:hover .guest-q-chevron{color:var(--green);transform:translateX(3px)}
.guest-q-toolbar{display:flex;gap:10px;margin-top:4px}
.guest-questions-form{display:flex;flex-direction:column}
.guest-section-divider{display:flex;align-items:center;gap:10px;margin:20px 0 12px;padding:8px 12px;background:#ffffff08;border-left:3px solid var(--green);border-radius:4px}
.guest-section-divider strong{font-size:14px;color:var(--ink)}
.guest-section-divider span{font-size:12px;color:var(--muted)}

.guest-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end}
.guest-row.has-remove{grid-template-columns:1fr 1fr auto}
.remove-guest-btn{min-height:44px;width:44px;padding:0;border-radius:7px;color:#ffabab;border-color:var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center}
.add-guest-btn{width:100%;min-height:44px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--green);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.add-guest-btn:hover{border-color:var(--green);background:#f4cc5712}
.question-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.question-actions button{margin:0!important;width:100%!important;height:44px!important;min-height:44px!important;padding:0 14px!important;font-size:12px!important;border:1px solid var(--line)!important;border-radius:8px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;box-sizing:border-box!important;white-space:nowrap}
.question-save-row{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding-top:4px}
@media(max-width:520px){.question-actions{grid-template-columns:1fr}}
.capsule-showcase{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:34px 28px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;transition:border-color .18s,background .18s}
.capsule-showcase:hover{border-color:#f4cc5766;background:#242428}
.capsule-number-play{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin:6px auto}
.front-numbers{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:6px;padding-right:2px;border:0}
.front-row{display:flex;align-items: center;justify-content:flex-end;gap:16px}
.front-row span{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);text-align:right}
.front-row b{font-size:clamp(34px,4.5vw,46px);font-weight:800;font-variation-settings:'wght' 800,'opsz' 48;line-height:.95;color:var(--ink);min-width:1.5ch;text-align:right;letter-spacing:-.03em}
.front-row.is-filmed b{color:var(--green)}
.shared-total{font-size:clamp(68px,9vw,92px);font-weight:800;font-variation-settings:'wght' 800,'opsz' 72;line-height:.88;letter-spacing:-.045em;color:var(--ink);display:flex;align-items:center}
.shared-total em{font-style:normal;color:var(--green);font-weight:700;margin-right:3px}
.showcase-footer{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:8px}
.stat-bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;width:100%}
.stat-fill{height:100%;background:var(--green);border-radius:99px;transition:width .25s}
.structure-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.structure-item{padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.structure-item small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.structure-item strong{font-size:16px}
.upload-field{display:flex;flex-direction:column;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.upload-box{display:flex;align-items:center;gap:14px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:var(--bg)}
.upload-controls{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.upload-controls input[type="file"]{padding:6px;font-size:12px}
body[data-project-type="conti"] .sidebar nav{display:none!important}
.conti-setup-group{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.conti-setup-group>span{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--green)}
.conti-option-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.conti-option-row.two-cols{grid-template-columns:repeat(2,minmax(0,1fr))}
.conti-choice{position:relative;cursor:pointer;margin:0}
.conti-choice input{position:absolute;opacity:0;pointer-events:none}
.conti-choice span{display:flex;align-items:center;justify-content:center;height:48px;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;font-weight:700;text-align:center;box-sizing:border-box;transition:border-color .15s,background .15s}
.conti-choice input:checked+span{border-color:var(--green);background:#f4cc5718;color:var(--green)}
.conti-custom-scene-input{width:100%!important;height:48px!important;min-height:48px!important;padding:0 12px!important;border:1px solid var(--line)!important;border-radius:10px!important;background:var(--bg)!important;color:var(--ink)!important;font-size:15px!important;font-weight:700!important;text-align:center!important;box-sizing:border-box!important;transition:border-color .15s,background .15s}
.conti-custom-scene-input::placeholder{color:var(--muted);font-weight:700;opacity:1}
.conti-custom-scene-input:focus::placeholder{color:transparent!important}
.conti-custom-scene-input.is-active,.conti-custom-scene-input:focus{border-color:var(--green)!important;background:#f4cc5718!important;color:var(--green)!important;outline:none!important}
.conti-back-heading{border:0!important;background:transparent!important;padding:0!important;margin:0!important;min-height:0!important;font:inherit!important;color:var(--ink)!important;display:inline-flex!important;align-items:center!important;gap:6px!important;cursor:pointer!important;text-align:left!important}
.conti-back-heading .back-arrow{color:var(--green);flex-shrink:0;margin-left:-4px;transition:transform .15s}
.conti-back-heading:hover .back-arrow{transform:translateX(-3px)}
.conti-share-icon-btn{width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important;padding:0!important;border-radius:10px!important;border:1px solid var(--line)!important;background:var(--paper)!important;color:var(--green)!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;flex-shrink:0!important;align-self:center!important}
.conti-ended-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.conti-ended-actions button{min-height:48px;height:48px;font-size:14px;font-weight:700;margin:0}
.conti-start-fields{display:grid;grid-template-columns:1fr;gap:10px;margin-top:4px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.conti-setup-step[hidden]{display:none!important}
.conti-ep-picker{display:flex;flex-wrap:wrap;gap:2px 4px}
.conti-ep-choice{position:relative;cursor:pointer;margin:0}
.conti-ep-choice input{position:absolute;opacity:0;pointer-events:none}
.conti-ep-choice span{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 6px;border:0;background:transparent;color:var(--muted);font-size:16px;font-weight:600;transition:color .15s}
.conti-ep-choice:hover span{color:var(--ink)}
.conti-ep-choice input:checked+span{color:var(--green);font-weight:800}
.conti-ep-choice input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
.conti-setup-group[hidden],.conti-start-fields[hidden],.conti-start-fields label[hidden]{display:none!important}
.conti-start-fields label{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--ink);gap:6px}
.conti-start-fields input{background:var(--paper);font-size:14px;padding:10px 12px}
.conti-scenes-bar{display:flex;align-items:center;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.conti-scene-tab{min-height:36px;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--paper);color:var(--muted);white-space:nowrap}
.conti-scene-tab.active{background:var(--green);border-color:var(--green);color:#17171a}
.conti-shots-stack{display:flex;flex-direction:column;gap:20px}
.conti-shot-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.conti-shot-head{padding:16px 18px;background:#202024;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.conti-shot-card.is-waiting-desc .conti-shot-head{border-bottom:0}
.conti-shot-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.conti-shot-badge{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--green)}
.conti-shot-desc{width:100%;padding:9px 12px;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.conti-shot-desc:focus{border-color:var(--green);outline:2px solid var(--green)}
.conti-shot-desc-hint{font-size:11px;color:var(--muted);font-weight:400;margin:0}
.conti-shot-card.has-desc .conti-shot-desc-hint{display:none}
.conti-wrap{overflow-x:auto}
.conti-table{width:100%;border-collapse:collapse;font-size:13px}
.conti-table th{background:#1b1b1e;color:var(--green);font-size:10px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;padding:10px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;white-space:nowrap}
.conti-table thead tr:first-child th:last-child,.conti-table tbody td:last-child{border-right:0}
.conti-table tr.conti-subhead th{background:#202024;color:var(--muted);font-size:9px;padding:6px 8px;border-right:1px solid var(--line)}
.conti-table td{padding:6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle}
.conti-table tbody tr:last-child td{border-bottom:0}
.conti-table tbody tr:hover{background:#ffffff05}
.conti-table input,.conti-table select{width:100%;min-height:36px;padding:6px;font-size:13px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink);text-align:center}
.conti-table input:focus,.conti-table select:focus{background:var(--bg);border-color:var(--line);outline:none}
.conti-num{width:54px;text-align:center}
.conti-num input{font-weight:700}
.conti-cam{min-width:88px}
.conti-audio{min-width:88px}
.conti-file-field{display:flex;align-items:center;position:relative;width:100%;min-width:0}
.conti-file-field input{width:100%!important;padding:6px 22px 6px 4px!important;text-align:center!important}
.conti-file-field.is-cancelled input{color:var(--muted)!important;text-decoration:line-through!important;opacity:0.55!important;cursor:not-allowed!important}

function download(data,name,type='application/json'){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);}
function draft(){dirty=true;const st=$('#save-state');try{safeStorage.setItem(draftKey(p.id),JSON.stringify({project:p,token}));if(st)st.textContent='Local draft · unsaved';}catch{if(st)st.textContent='Unsaved · backup needed';}}

function field(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function area(label,name,value='',extra=''){return `<label>${label}<textarea name="${name}" ${extra}>${esc(value)}</textarea></label>`;}
function options(values,selected){return values.map(v=>`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(v)}</option>`).join('');}
function stat(n,label,sub=''){return `<div class="stat"><strong>${n}</strong><span>${label}</span><small>${sub}</small></div>`;}
function header(){const activeTab=view==='preview'?'script':view==='conti-record'?'conti':view;const isContiOnly=p?.settings?.projectType==='conti';return `<aside class="sidebar"><a class="brand" href="#" data-action="all-projects"><span class="brand-mark" aria-label="2list">${brandEmblemSvg}</span><span>2list<small>WRITING STUDIO</small></span></a><div class="project-picker"><label>ACTIVE PROJECT</label><div class="project-picker-row"><details class="project-menu"><summary aria-label="Active project"><span>${esc(p?.name||'Select project')}</span><span aria-hidden="true">▾</span></summary><div class="project-menu-list">${projects.map(x=>`<button type="button" class="project-menu-item ${x.id===p?.id?'active':''}" data-action="open-project" data-id="${esc(x.id)}"><span>${esc(x.name)}</span>${x.id===p?.id?'<span>✓</span>':''}</button>`).join('')}<div class="project-menu-divider"></div><button type="button" class="project-menu-item" data-action="new-project"><span>＋ Create new project</span></button><button type="button" class="project-menu-item" data-action="all-projects"><span>← All projects</span></button></div></details><details class="dots-menu ${view==='settings'||view==='account'?'active':''}"><summary aria-label="Menu" title="Menu">⋮</summary><div class="dots-menu-list"><button type="button" class="project-menu-item ${view==='account'?'active':''}" data-action="nav" data-view="account"><span>Account</span></button><button type="button" class="project-menu-item ${view==='settings'?'active':''}" data-action="nav" data-view="settings"><span>Settings</span></button></div></details></div></div>${isContiOnly?'':`<nav aria-label="Main navigation">${navs.map(([v,l])=>`<button data-action="nav" data-view="${v}" class="nav-link ${activeTab===v?'active':''}" aria-label="${l}" ${activeTab===v?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icons[v]}</span><span class="nav-label desktop-label">${l}</span><span class="nav-label mobile-label" aria-hidden= function formatProgramTitle(name){

 const words=clean.split(' ').filter(Boolean);
 if(words.length===1||clean.length<=15){
  const sz=clean.length<=7?'size-xl':clean.length<=11?'size-lg':'size-md';
  return `<h2 class="program-title one-line ${sz}"><span>${esc(clean)}</span></h2>`;
 }
 const splitAt=Math.floor(words.length/2);
 const line1=words.slice(0,splitAt).join(' '), line2=words.slice(splitAt).join(' ');
 const maxLen=Math.max(line1.length,line2.length);
 const sz=maxLen<=10?'size-lg':maxLen<=14?'size-md':'size-sm';
 return `<h2 class="program-title two-line ${sz}"><span>${esc(line1)}</span><span>${esc(line2)}</span></h2>`;
}
function parseTxDate(v){
 const s=String(v||'').trim();if(!s)return null;

 const d=iso?new Date(+iso[1],+iso[2]-1,+iso[3]):new Date(s);
 return Number.isNaN(d.getTime())?null:d;
}
function formatTxDate(v){const d=parseTxDate(v);return d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'}):(String(v||'').trim()||'TBA');}

function throwScriptReady(epNo){
 const s=p.scripts?.[epNo];if(!s)return false;
 if(typeof s.throwReady==='boolean')return s.throwReady;
 const hostSecs=s.sections.filter(x=>hostKey(x)&&hostKey(x)!=='Pr');

function nextFileNumber(prev,fallback='001'){
 const s=String(prev??'').trim();
 if(!s)return String(fallback||'001');
 const m=s.match(/^(.*?)(\d+)(\D*)$/);

 const nextNum=String(Number(m[2])+1).padStart(m[2].length,'0');

function recalculateContiFileNumbers(rows){
 if(!Array.isArray(rows))return;
 const s=p?.settings||{};
 const cols=['cam1','cam2','cam3','audio'];
 const activeRows=rows.filter(r=>!r.draft);
 const baseTime=Date.now()-activeRows.length*1000;
 activeRows.forEach((r,idx)=>{
  if(!r.createdAt)r.createdAt=baseTime+idx*1000;
 });
 const sorted=[...activeRows].sort((a,b)=>(Number(a.createdAt)||0)-(Number(b.createdAt)||0));

 for(const col of cols){
  const startSetting = col==='cam1'?s.contiStartCam1:col==='cam2'?s.contiStartCam2:col==='cam3'?s.contiStartCam3:s.contiStartAudio;
  const fallback = String(startSetting||'001').trim()||'001';
  let lastVal = null;

  for(const r of sorted){
   const isOff = Boolean(r[`${col}_off`]);
   if(isOff){
    r[col] = '';
    continue;
   }
   if(r[`${col}_manual`]){
    const manualVal = String(r[col]||'').trim();
    if(manualVal){
     lastVal = manualVal;
    }
   }else{
    if(lastVal === null){
     const cur = String(r[col]||'').trim();
     r[col] = cur || fallback;
    }else{
     r[col] = nextFileNumber(lastVal, fallback);
    }
    lastVal = r[col];
   }
  }
 }
}

function getRecordGuestList(r){
 const names=String(r?.guest||'').split('\n'),titles=String(r?.title||'').split('\n');
 const count=Math.max(1,names.length,titles.length);
 const list=Array.from({length:count},(_,i)=>({name:names[i]||'',title:titles[i]||''}));
 if(list.length>1){
  const filtered=list.filter((g,i)=>g.name.trim()||g.title.trim()||i===0);
  return filtered.length?filtered:[{name:'',title:''}];
 }
 return list.length?list:[{name:'',title:''}];
}
function getGuestQuestionsList(r){
 const guests=getRecordGuestList(r);
 const gq=r?.guestQuestions;
 if(Array.isArray(gq)&&gq.length){
  return guests.map((_,i)=>String(gq[i]||''));
 }
 const raw=String(r?.questions||'');
 if(raw.includes('### GUEST ')){
  const parts=raw.split(/### GUEST \d+:?\s*[^\n]*\n/i);
  const cleaned=parts.slice(1).map(p=>p.trim());
  return guests.map((_,i)=>cleaned[i]||'');
 }
 return guests.map((_,i)=>(i===0?raw:''));
}
function getGuestQuestionText(r,idx){

 return list[idx]||'';
}
function setGuestQuestionText(r,idx,text){
 const guests=getRecordGuestList(r);
 const list=getGuestQuestionsList(r);
 while(list.length<guests.length)list.push('');
 list[idx]=String(text||'').trim();
 r.guestQuestions=list;
 if(guests.length<=1){
  r.questions=list[0]||'';
 }else{
  const out=[];
  for(let i=0;i<guests.length;i++){
   const gName=guests[i].name.trim()||(i===0?'Main Guest':`Supporting Guest ${i}`);
   const qText=list[i]?formatQuestionsDoubleSpaced(list[i]):'';
   if(qText){
    out.push(`### GUEST ${i+1}: ${gName}\n${qText}`);
   }
  }
  r.questions=out.length?out.join('\n\n'):(list[0]||'');
 }
}

function buildQuestionsPdfBlob(programName,rec){
 const escPdf=s=>String(s||'').replace(/[^\x20-\x7E]/g,' ').replace(/([()\\])/g,'\\$1');
 const wrap=(text,max=78)=>{const out=[];for(const raw of String(text||'').split(/\r?\n/)){const words=raw.trim().split(/\s+/).filter(Boolean);if(!words.length){out.push('');continue;}let cur='';for(const w of words){if((cur+' '+w).trim().length>max){if(cur)out.push(cur);cur=w;}else cur=(cur+' '+w).trim();}if(cur)out.push(cur);}return out;};
 const guests=parseGuestRows(rec).map(g=>[g.name.trim(),g.title.trim()].filter(Boolean).join(' — ')).filter(Boolean);
 const lines=[];
 lines.push({font:'F2',size:16,lead:22,text:`${programName||'PROGRAM'} — INTERVIEW QUESTIONS`});
 lines.push({font:'F2',size:12,lead:18,text:`TOPIC: ${rec.topic||'Untitled'}`});
 if(rec.location||rec.date)lines.push({font:'F1',size:10,lead:15,text:`LOCATION: ${rec.location||'TBA'}   |   FILMING DATE: ${rec.date||'TBA'}`});
 if(guests.length)for(const g of guests)lines.push({font:'F1',size:10,lead:15,text:`GUEST: ${g}`});
 if(rec.description?.trim()){lines.push({font:'F1',size:10,lead:10,text:''});for(const l of wrap(`DESCRIPTION: ${rec.description.trim()}`,84))lines.push({font:'F1',size:10,lead:14,text:l});}
 lines.push({font:'F2',size:11,lead:22,text:'INTERVIEW QUESTIONS:'});
 const qLines=wrap(rec.questions?.trim()||'[No questions entered yet]',82);
 for(const l of qLines)lines.push({font:'F1',size:11,lead:16,text:l});
 let y=790;const ops=['BT'];
 for(const item of lines){if(y<55)break;ops.push(`/${item.font} ${item.size} Tf 1 0 0 1 48 ${y} Tm (${escPdf(item.text)}) Tj`);y-=item.lead;}
 ops.push('ET');
 const stream=ops.join('\n');
 const objs=[
  '1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj',
  '2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj',
  '3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>\nendobj',
  '4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj',
  '5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>\nendobj',
  `6 0 obj\n<< /Length ${stream.length} >>\nstream\n${stream}\nendstream\nendobj`
 ];
 let pdf='%PDF-1.4\n';const offsets=[0];
 for(const o of objs){offsets.push(pdf.length);pdf+=o+'\n';}
 const xrefPos=pdf.length;
 pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('');
 pdf+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;
 return new Blob([pdf],{type:'application/pdf'});
}

function parseQuestionsList(raw){
 if(!raw||!String(raw).trim())return [];
 const paragraphs=String(raw).trim().split(/\n\s*\n+/);
 const questions=[];
 for(const p of paragraphs){
  const pClean=p.trim();
  if(!pClean)continue;
  const lines=pClean.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length)continue;
  lines[0]=lines[0].replace(/^(?:(?:\d+[\.\)])|(?:Q\d+:?)|(?:Soalan\s*\d+:?))\s*/i,'').trim();
  if(lines.length>1){
   lines[1]=lines[1].replace(/^(?:(?:\d+[\.\)])|(?:Q\d+:?)|(?:Soalan\s*\d+:?))\s*/i,'').trim();
  }
  const cleanedBlock=lines.join('\n');
  if(cleanedBlock)questions.push(cleanedBlock);
 }
 return questions;
}
function formatQuestionsDoubleSpaced(raw){
 const questions=parseQuestionsList(raw);
 if(!questions.length)return '';
 const formatted=[];
 for(let idx=0;idx<questions.length;idx++){
  const lines=questions[idx].split('\n');
  lines[0]=`${idx+1}. ${lines[0]}`;
  formatted.push(lines.join('\n'));
 }
 return formatted.join('\n\n');
}

function collectQuestionsFromDom(container){

function renderQuestionsNumberedDisplay(raw){

function renderInterviewQuestionsPopupHtml(r){

 const guestQuestions=getGuestQuestionsList(r);

  return `<ol class="interview-q-list">${qList.map((q,idx)=>{
   const lines=q.split('\n');
   const primary=lines[0]||'';
   const secondary=lines.slice(1).join('\n');
   return `<li class="interview-q-item"><span class="interview-q-badge">${idx+1}</span><div class="interview-q-text"><div class="interview-q-primary">${esc(primary)}</div>${secondary?`<div class="interview-q-secondary">${esc(secondary)}</div>`:''}</div></li>`;

async function executeRecordSave(recordId,recData,parsedEp,cap,rAI,addExtraThrow=false){
 const next=clone(p);
 const old=next.records.find(x=>x.id===recordId);
 const r={...newRecord(),...old,...recData,...rAI,id:recordId,episode:parsedEp,capsule:cap};
 next.records=next.records.filter(x=>x.id!==r.id);
 next.records.push(r);
 normalizeOptionalEpisode(next);
 if(addExtraThrow && parsedEp!==null){
  if(!Array.isArray(next.throws))next.throws=[];
  const extraThrow=newThrow(parsedEp);
  extraThrow.topic=`Throw · Capsule ${cap} (${r.topic||'Extra Story'})`;
  extraThrow.description=`Host throw specifically for additional capsule ${cap} in episode ${parsedEp}.`;
  extraThrow.date=r.date||'';
  extraThrow.location=r.location||'';
  next.throws.push(extraThrow);
 }
 validate(next);
 p=next;
}

function checkCapsuleSlotConflict(f,triggerEl){
 if(!f||f.id!=='record-form')return;
 const recId=f.dataset.id;
 const epInput=f.querySelector('[name="episode"]');
 const capSelect=f.querySelector('[name="capsule"]');
 if(!capSelect||!epInput)return;
 const capVal=String(capSelect.value||'').trim();
 const rawEp=epInput.value;
 const epVal=(rawEp===''||rawEp===null||Number.isNaN(Number(rawEp))||Number(rawEp)<=0)?null:Math.floor(Number(rawEp));
 if(!capVal||epVal===null){
  if(triggerEl)triggerEl.dataset.prevVal=triggerEl.value;
  return;
 }
 const conflicts=(p?.records||[]).filter(r=>r.id!==recId&&r.status!=='CANCELLED'&&Number(r.episode)===epVal&&String(r.capsule)===capVal);
 if(!conflicts.length){
  if(triggerEl)triggerEl.dataset.prevVal=triggerEl.value;
  return;
 }
 showCapsuleSlotWarningOverlay(f,epVal,capVal,conflicts,triggerEl);
}

function showCapsuleSlotWarningOverlay(f,epVal,capVal,conflicts,triggerEl){
 const dlg=$('#slot-warning-dialog');
 if(!dlg)return;
 const conflictListHtml=conflicts.map(c=>{
  const topic=c.topic?.trim()||'Untitled capsule';
  const guests=getRecordGuestList(c);
  const guestName=guests[0]?.name?.trim()||c.guest?.trim()||'';
  return `<div class="slot-warning-item"><div class="slot-warning-badge">Capsule ${esc(capVal)}</div><div class="slot-warning-info"><strong>${esc(topic)}</strong>${guestName?`<small>${esc(guestName)}</small>`:''}</div></div>`;
 }).join('');
 dlg.dataset.triggerName=triggerEl?.name||'capsule';
 dlg.innerHTML=`<div class="slot-warning-header"><span class="slot-warning-icon" aria-hidden="true">⚠️</span><div><p class="eyebrow" style="color:var(--green,#f4cc57);font-weight:800;margin:0 0 4px">SLOT ALREADY TAKEN</p><h3 style="margin:0;font-size:20px;font-weight:800;color:#fff">Episode ${epVal} · Capsule ${esc(capVal)}</h3></div></div><p class="slot-warning-desc">Slot <strong>Capsule ${esc(capVal)}</strong> in <strong>Episode ${epVal}</strong> is already assigned to:</p><div class="slot-warning-list">${conflictListHtml}</div><p class="slot-warning-note">Do you wish to continue? This slot will contain <strong>${conflicts.length+1} capsules</strong> for Episode ${epVal} (suitable when the episode is under-running).</p><div class="slot-warning-actions"><div class="slot-warning-btn-row"><button type="button" class="primary slot-btn-yes" data-action="confirm-slot-warning" data-add-throw="false">Yes</button><button type="button" class="primary slot-btn-throw" data-action="confirm-slot-warning" data-add-throw="true">Add Throw</button></div><button type="button" class="slot-revert-btn" data-action="revert-slot-warning">Cancel &amp; Change Slot</button></div>`;
 if(!dlg.open){
  try{dlg.showModal();}catch(e){dlg.show();}
 }
 dlg.querySelector('.slot-btn-yes')?.focus();
}

async function extractScriptText(file){
 if(!/\.pdf$/i.test(file.name)&&file.type!=='application/pdf')return (await file.text()).replace(/\s+/g,' ').trim();
 const bytes=new Uint8Array(await file.arrayBuffer());
 const raw=new TextDecoder('latin1').decode(bytes);
 const chunks=[];
 const collect=str=>{for(const m of str.matchAll(/\(([^()\\]*(?:\\.[^()\\]*)*)\)\s*Tj|\[([^\]]*)\]\s*TJ/g)){const body=m[1]??m[2]??'';const clean=body.replace(/\\([nrtbf()\\])/g,(_,c)=>c==='n'?'\n':c==='r'?'':c==='t'?' ':c).replace(/\(([^()\\]*(?:\\.[^()\\]*)*)\)/g,'$1 ').replace(/[^\x20-\x7E\n\u00A0-\u00FF]/g,' ').trim();if(clean)chunks.push(clean);}};
 collect(raw);
 if(typeof DecompressionStream!=='undefined'){
  for(const m of raw.matchAll(/stream\r?\n([\s\S]*?)\r?\nendstream/g)){
   const s=m[1];if(s.length>500000)continue;
   const buf=new Uint8Array(s.length);for(let i=0;i<s.length;i++)buf[i]=s.charCodeAt(i)&0xff;
   for(const fmt of ['deflate','deflate-raw']){
    try{const ds=new DecompressionStream(fmt);const w=ds.writable.getWriter();w.write(buf);w.close();const out=await new Response(ds.readable).arrayBuffer();collect(new TextDecoder('latin1').decode(out));break;}catch{}
   }
  }
 }
 return chunks.join(' ').replace(/\s+/g,' ').trim();
}

 if(f.id==='settings-form'){const next=clone(p);next.name=data.name.trim();next.settings={...next.settings,...data,station:String(data.station||'').trim(),slot:+data.slot,target:+data.target,capsules:+data.capsules,episodes:+data.episodes,breaks:Array.from({length:breaksForSlot(+data.slot)},(_,i)=>i+1).join(',')};delete next.settings.name;validate(next);p=next;ep=Math.min(ep,p.settings.episodes);draft();view=p.settings.projectType==='conti'?'conti':'home';await save();}
 }catch(err){const error=f.querySelector('.form-error');if(error)error.textContent=err.message;else notify(err.message);}finally{f.dataset.submitting='false';}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
let touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',e=>{
 const vp=e.target.closest('#item-slider-viewport');
 if(!vp)return;
 touchStartX=e.changedTouches[0].screenX;
 touchStartY=e.changedTouches[0].screenY;
},{passive:true});
document.addEventListener('touchend',e=>{
 const vp=e.target.closest('#item-slider-viewport');
 if(!vp)return;
 const diffX=e.changedTouches[0].screenX-touchStartX;
 const diffY=e.changedTouches[0].screenY-touchStartY;
 if(Math.abs(diffX)>40&&Math.abs(diffX)>Math.abs(diffY)*1.1){
  let nextTab=itemActiveTab;
  if(itemActiveTab==='split'){
   if(diffX<0)nextTab='capsule';
   else if(diffX>0)nextTab='question';
  }else if(itemActiveTab==='capsule'){
   if(diffX>110)nextTab='question';
   else if(diffX>0)nextTab='split';
  }else if(itemActiveTab==='question'){
   if(diffX<-110)nextTab='capsule';
   else if(diffX<0)nextTab='split';
  }
  if(nextTab!==itemActiveTab){
   itemActiveTab=nextTab;
   vp.className=`item-slider-viewport state-${nextTab}`;
   vp.dataset.state=nextTab;
  }
 }
},{passive:true});


function legacyDialog(){
 const d=document.createElement('dialog');d.innerHTML=`<form><div class="dialog-heading"><h2>Import legacy log</h2><button type="button" class="close-legacy">✕</button></div><p>Export the INPUT LOG and INPUT SCRIPT tabs as CSV from Sheets. Import creates new IDs and leaves the original workbook intact. Matching questions/VO requires a unique # and matching facts.</p><label>INPUT LOG CSV<input type="file" name="log" accept=".csv,text/csv" required></label><label>INPUT SCRIPT CSV (optional)<input type="file" name="script" accept=".csv,text/csv"></label><p class="form-error" role="alert"></p><button type="submit" class="primary">Review import</button><div class="legacy-preview"></div></form>`;document.body.append(d);d.showModal();const close=()=>{d.close();d.remove();};d.querySelector('.close-legacy').onclick=close;d.addEventListener('cancel',()=>setTimeout(()=>d.remove(),0));
 d.querySelector('form').onsubmit=async e=>{e.preventDefault();e.stopPropagation();const f=e.target;try{const log=f.elements.log.files[0],script=f.elements.script.files[0];if(log.size>2e6||script?.size>2e6)throw new Error('Import limit: 2 MB per CSV.');const result=prepareLegacy(await log.text(),script?await script.text():'');const candidate=clone(p);candidate.records.push(...result.records);validate(candidate);const preview=f.querySelector('.legacy-preview');preview.innerHTML=`<h3>${result.records.length} records · ${result.matched} questions/VO matches</h3><ul>${result.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul><p>Duplicate assignments will be rejected. All records will be imported into the active project: ${esc(p.name)}.</p><button type="button" class="primary accept-import">Accept import into draft</button>`;preview.querySelector('button').onclick=()=>{p=candidate;draft();close();view='log';render();notify('Import added to draft. Review the records, then Save.');};}catch(err){f.querySelector('.form-error').textContent=err.message;f.querySelector('.legacy-preview').innerHTML='';}};
}

function hostKey(section){const key=p.records.find(r=>r.id===section.source)?.capsule||section.source;return /^(Op|Pr|Clo|T\d+)$/.test(key)?key:null;}
function sourcePanel(provenance){
 if(!provenance)return '';
 const safe=s=>/^https?:\/\//i.test(s?.url||'');
 return `<details class="source-panel"><summary>AI sources & review ${provenance.searched?'· research web':provenance.mode==='supplied-facts'?'· supplied facts only':'· search unconfirmed'}</summary>${provenance.notes?`<p>${esc(provenance.notes)}</p>`:''}${(provenance.citations||[]).filter(safe).map(c=>`<p>${esc(c.excerpt||'Fact reference')} <a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.title||c.url)} ↗</a></p>`).join('')}<small>Sources consulted by the search tool:</small><ul>${(provenance.consulted||[]).filter(safe).map(c=>`<li><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.title||c.url)}</a></li>`).join('')}</ul>${!(provenance.citations||[]).length?'<p>No external fact citations are available. Do not assume social profiles have been verified.</p>':''}<small>Text may have been edited after research. This panel is excluded from the printed script. Research and AI require a server connection and key.</small></details>`;
}
async function requestAI(project,options){
 buildDraftRequest(project,options,'validate-only');
 if(adapter.mode==='sheets')return adapter.call('draftHost',project,options);
 const response=await fetch('/api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project,options})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not connect to AI.');return result;
}
function aiOptions(target,seconds){return {target,episode:ep,seconds:seconds||30,tone:p.settings.tone||'Warm, natural and professional',notes:p.settings.aiNotes||''};}
async function generateHostAI(sectionId){
 const fresh=sectionId?clone(p.scripts[ep]):refresh(p.scripts[ep],generate(p,ep));const selected=sectionId?fresh.sections.filter(s=>s.id===sectionId):fresh.sections.filter(s=>hostKey(s));
 const tasks=selected.map(s=>({s,options:aiOptions(hostKey(s),s.seconds)}));
 for(const task of tasks)buildDraftRequest(p,task.options,'validate-only');
 activity='Generating AI…';busy=true;render();let complete=0;const failures=[];
 try{
 // Three requests at a time. Each success is written to the script immediately and backed up locally.
 const queue=[...tasks];const worker=async()=>{while(queue.length){const task=queue.shift();try{const result=await requestAI(p,task.options);const index=fresh.sections.findIndex(s=>s.id===task.s.id);fresh.sections[index]={...applyAI(task.s,result,p.settings.host),aiOptions:task.options};if(!fresh.sections[index].seconds){fresh.sections[index].seconds=task.options.seconds;fresh.sections[index].estimatedDuration=true;}complete++;p.scripts[ep]=fresh;draft();$('#save-state').textContent=`AI ${complete}/${tasks.length} · local draft`;}catch(e){failures.push(`${task.s.label}: ${e.message}`);if(/not configured|quota|AI unavailable|AI connection failed/i.test(e.message))queue.length=0;}}};
 await Promise.all(Array.from({length:Math.min(1,tasks.length)},worker));
 if(complete){view='script';notify(`${complete} host texts written into the script.${failures.length?' Some sections failed; their previous text is preserved.':' Ready to Save / PDF.'}`);}if(failures.length){dialog(`<h2>${complete?'Some AI sections are incomplete':'AI could not be generated'}</h2><p>Existing text in failed sections is preserved. Requests are not retried automatically.</p><p>${esc(failures[0])}</p><button data-action="close">Close</button>`);}
 }finally{busy=false;render();}
}
async function generateRecordAI(button){
 const gf=$('#guest-questions-form');
 const rf=$('#record-form');
 const f=gf||rf;if(!f)return;
 const rId=f.dataset.id;
 const gIdx=gf?Number(gf.dataset.guestIdx||0):0;
 const rec=p.records.find(r=>r.id===rId);
 if(!rec)return;
 const guests=getRecordGuestList(rec);
 const currentGuest=guests[gIdx]||{name:'',title:''};
 const guestName=currentGuest.name.trim()||(gIdx===0?'Main Guest':`Supporting Guest ${gIdx}`);
 const guestTitle=currentGuest.title.trim()||(gIdx===0?'Main Guest':'Supporting Guest');

 const data=collectRecordFormData(f);const next=clone(p);const record={...newRecord(),...next.records.find(r=>r.id===f.dataset.id),...data,id:f.dataset.id,episode:data.episode};
 const options={...aiOptions('questions',duration(rec.duration)),episode:rec.episode,recordId:rec.id,guestIndex:gIdx,guestName:guestName,guestTitle:guestTitle};button.disabled=true;button.textContent=`Writing questions for ${guestName}…`;
 try{
  const result=await requestAI(next,options);if(!f.isConnected)return;
  recordAI.questionHistory=[...(recordAI.questionHistory||[]),{text:f.elements.questions.value,research:recordAI.research}].slice(-5);
  recordAI.research=result.provenance;
  f.elements.questions.value=result.text;
  const src=$('#record-sources');if(src)src.innerHTML=sourcePanel(recordAI.research);
  notify('AI questions generated. Click Save questions to save.');
 }finally{button.disabled=false;button.textContent='✦ Generate questions from facts';}
}

function fitVisualViewport(){
 const v=window.visualViewport;
 const vh=v?v.height:window.innerHeight;
 const vt=v?v.offsetTop:0;
 const kb=Math.max(0,window.innerHeight-(vt+vh));
 document.documentElement.style.setProperty('--visual-height',`${vh}px`);
 document.documentElement.style.setProperty('--visual-top',`${vt}px`);
 document.documentElement.style.setProperty('--keyboard-height',`${kb}px`);
}
window.visualViewport?.addEventListener('resize',()=>{
 fitVisualViewport();
 const active=document.activeElement;
 if(active&&active.matches?.('input,textarea,select')){
  active.scrollIntoView({behavior:'smooth',block:'center'});
 }
});
window.visualViewport?.addEventListener('scroll',fitVisualViewport);
fitVisualViewport();
document.addEventListener('focusin',e=>{
 if(e.target.matches?.('input,textarea,select')){
  setTimeout(()=>{
   e.target.scrollIntoView({behavior:'smooth',block:'center'});
  },280);
 }
});
