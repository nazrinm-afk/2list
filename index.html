 "TX", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-19", "episode": 4, "capsule": "1", "type": "Interview", "topic": "What's in My bag", "description": "Ray's Place", "guest": "", "title": "", "location": "KCH", "date": "2026-07-30", "status": "TX", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-20", "episode": 8, "capsule": "1", "type": "Interview", "topic": "Excercise", "description": "Ray's Place", "guest": "", "title": "", "location": "KCH", "date": "2026-07-30", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-21", "episode": 3, "capsule": "1", "type": "Interview", "topic": "Color Corrector", "description": "Ray's Place", "guest": "", "title": "", "location": "KCH", "date": "2026-07-30", "status": "TX", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-22", "episode": 7, "capsule": "1", "type": "Interview", "topic": "Glam Makeup", "description": "Ray's Place", "guest": "", "title": "", "location": "KCH", "date": "2026-07-31", "status": "EDITED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-23", "episode": 4, "capsule": "5", "type": "Interview", "topic": "Eden spa", "description": "Spa @ Damai lagoon Resort", "guest": "", "title": "", "location": "KCH", "date": "2026-08-04", "status": "TX", "duration": "", "questions": "Boleh perkenalkan diri?\n\n Apakah konsep utama di Eden Spa dan kenapa lebih menekankan elemen rawatan tradisional Melayu?\n\nBerdasarkan menu spa, Eden Spa menawarkan rawatan khusus seperti 'Prenatal', 'Postnatal' (pantang), dan 'Royal Malay Bridal Ritual'. Boleh jelaskan keunikan teknik tradisional seperti urutan bidan, sengkak, batu tungku, mahupun bertangas yang dibawakan di sini?\n\nSelai dari itu, kami difahamkan ada juga rawatan lain seperti Chakra Massage, oxygenated bath dan lain lain. Boleh terangkan serba sedikit tentang itu?\n\nAdakah perkhidmatan Eden Spa ini terbuka secara eksklusif untuk tetamu menginap di resort sahaja, atau orang luar (walk-in/outsiders) juga dialu-alukan untuk menikmati rawatan di sini?\n\nKedudukan Eden Spa di Damai Lagoon berada jauh sedikit dari kesibukan pusat bandar Kuching. Pada pandangan anda, adakah faktor lokasi ini satu kelebihan atau tantangan dari sudut operasi, dan bagaimana ia memberi pengalaman 'getaway' yang lebih menenangkan buat pelanggan?\n\nApakah yang menjadikan Eden Spa pilihan utama buat wanita atau bakal pengantin yang inginkan rawatan kesihatan dan kecantikan holistik di Sarawak?\n\nApakah yang pihak Eden Spa mahu setiap pelanggan bawa balik selepas melangkah keluar dari spa ini?", "vo": "Selain dari rawatan tradisional, EDEN SPA juga menyediakan kepelbagaian dalam servis. Apa yang menarik minat MYA adalah Urutan Chakra atau Chakra Massage\n\n\n\nRawatan mandian oksigen ini turut menarik perhatian MYA. Selain disediakan di bilik tertentu, rawatan ini juga tersedia di EDEN SPA. \n\n\n\nLebih menarik lagi, EDEN SPA tidak hanya ekslusif kepada tetamu resort ini malah juga dibuka untuk kkunjungan awam. ", "remarks": "", "profile": ""}, {"id": "rec-anggun-40", "episode": 4, "capsule": "3", "type": "Interview", "topic": "KLFW Tanoti", "description": "Membawa designers sarawak", "guest": "", "title": "", "location": "KL", "date": "2026-08-06", "status": "TX", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-57", "episode": 8, "capsule": "2", "type": "Interview", "topic": "Pure Day Studio", "description": "", "guest": "", "title": "", "location": "KCH", "date": "2026-08-14", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-58", "episode": 2, "capsule": "2", "type": "Interview", "topic": "J'us + TCAznizan", "description": "", "guest": "", "title": "", "location": "KCH", "date": "2026-08-14", "status": "TX", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-59", "episode": null, "capsule": "4", "type": "Interview", "topic": "Nang Ori", "description": "", "guest": "", "title": "", "location": "KCH", "date": "2026-08-14", "status": "CANCELLED", "duration": "", "questions": "SOALAN KAPSUL ANGGUN\nSubjek: Ratu Lada dan Butir Emas Hitam Sarawak\nDurasi: 7 Minit | Panel: Awaeang Kwasin\n1. Boleh kongsikan memori masa kecil anda membesar sebagai anak petani di\nKampung Bratan, dan bagaimana pengalaman membantu ibu bapa di kebun\nlada membentuk ketahanan diri anda hari ini?\n2. Pernah tak anda berasa malu atau rasa kerdil bergelar anak petani suatu ketika\ndahulu, dan apa titik perubahan yang membuatkan anda bangga dengan akar\numbi anda?\n3. Sebagai wanita Dayak/Bidayuh pertama yang berjaya menembusi industri lada\nyang didominasi oleh lelaki dan memegang lesen eksport, apakah cabaran\nterberat yang pernah anda hadapi?\n4. Apakah momen paling sukar apabila anda memutuskan untuk membawa lada\nSarawak keluar dari bahan mentah biasa kepada \"Nang Ori\"?\n5. Boleh ceritakan bagaimana pengalaman pahit kerugian besar sehingga ratusan\nribu ringgit dalam perniagaan pernah menguji kesabaran anda untuk terus\nbertahan?\n6. Apakah realiti sebenar kesukaran yang dihadapi oleh pekebun-pekebun kecil\nlada di luar bandar yang mendorong anda untuk memperjuangkan nasib mereka\ndan membeli terus daripada mereka tanpa menggunakan orang tengah?\n\n7. Berpegang kepada prinsip \"dalam rezeki kita, terselit rezeki orang lain\",\nbagaimana anda memastikan perniagaan Nang Ori ini bukan sahaja\nmenguntungkan syarikat tetapi turut mengangkat ekonomi komuniti suri rumah\ndan petani tempatan?\n8. Daripada memetik lada di kebun kampung sehingga kini memiliki dua buah\nkilang pemprosesan berskala tinggi di Demak Laut dan Melaka, apakah\nperasaan anda setiap kali melihat produk emas hitam Sarawak ini dieksport ke\nluar negara?\n9. Apakah perjuangan atau pengorbanan terbesar anda sebagai seorang ibu\nkepada lima orang anak dalam membahagikan masa antara empayar\nperniagaan dan keluarga?\n10. Jika anda boleh kembali ke masa lalu dan bercakap dengan \"Awaeang kecil\"\nyang sedang berjemur panas menjemur lada di kampung dahulu, apakah mesej\nyang ingin anda sampaikan kepadanya hari ini?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-60", "episode": 9, "capsule": "2", "type": "Interview", "topic": "Seraong, Igan", "description": ".", "guest": "", "title": "", "location": "MUKAH", "date": "2026-08-26", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-61", "episode": 2, "capsule": "5", "type": "Interview", "topic": "Sluvi", "description": "", "guest": "", "title": "", "location": "KCH", "date": "2026-08-27", "status": "TX", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-62", "episode": 11, "capsule": "2", "type": "Interview", "topic": "Sago Matu", "description": ".", "guest": "", "title": "", "location": "MUKAH", "date": "2026-08-27", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-63", "episode": 12, "capsule": "2", "type": "Interview", "topic": "Minyak Sekiu", "description": ".", "guest": "", "title": "", "location": "MUKAH", "date": "2026-08-27", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-64", "episode": 7, "capsule": "2", "type": "Interview", "topic": "Hydroponik Farm Matu", "description": ".", "guest": "", "title": "", "location": "MUKAH", "date": "2026-08-27", "status": "EDITED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-65", "episode": null, "capsule": "", "type": "Interview", "topic": "Kilang Sago Dalat", "description": "", "guest": "", "title": "", "location": "MUKAH", "date": "2026-08-27", "status": "CANCELLED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-66", "episode": 2, "capsule": "4", "type": "Interview", "topic": "Donna Yong", "description": "", "guest": "", "title": "", "location": "KCH", "date": "2026-08-28", "status": "TX", "duration": "", "questions": "SKRIP SOALAN KAPSUL ANGGUN\nSubjek: Nafas Baharu Sulaman Tradisi - Keringkam Bag Charms (Dear Origin)\nDurasi: 7 Minit | Panel: Donna Yong & Cikgu Leeza (LC Keringkam)\nDONNA\n1. Boleh Donna kongsikan, apakah sebenarnya cetusan idea di sebalik penghasilan\nKeringkam Charms (aksesori beg) ini, dan mengapa anda memilih untuk\nmengasimilasikan seni warisan yang sangat bernilai ini ke dalam bentuk aksesori\nharian?\n2. Sulaman keringkam secara tradisinya dihasilkan pada selendang atau selayah yang\nmemakan masa berbulan-bulan. Apakah cabaran terbesar yang Donna hadapi apabila\ncuba mengecilkan skala motif tradisional ini menjadi sebuah charm atau aksesori\nharian?\n3. Kita tahu bahawa perjalanan Donna dalam mendalami seni sulaman ini disokong kuat\noleh Cikgu Leeza daripada LC Keringkam. Boleh ceritakan bagaimana titik permulaan\nhubungan mentor-dan-pelajar ini bermula?\n4. Dari segi penghasilan untuk pasaran, bagaimana Donna memastikan ketelitian teknik\nsulaman benang emas tradisional ini kekal terpelihara pada setiap unit Keringkam\nCharms yang dihasilkan?\n5. Koleksi Keringkam Bag Charm ini juga telah dipilih sebagai cenderamata rasmi untuk\nTYT Yang di-Pertua Negeri Sarawak dan Toh Puan baru-baru ini. Apakah harapan\nDonna untuk jenama Dear Origin dalam membawa seni sulaman Sarawak ini ke\nperingkat global?\n6. Akhir sekali, apakah pesanan anda berdua kepada generasi muda di luar sana agar seni\nKeringkam Sarawak ini tidak 'hilang ditelan zaman'\n, sebaliknya terus mekar seperti\nBunga Mawar Astana?\n\nLEEZA\n1. Cikgu Leeza, selaku pengamal seni keringkam, boleh cikgu jelaskan mengenai keunikan\nmotif Bunga Mawar (Rose) ini? Mengapa ia dianggap sebagai motif arkib yang sangat\nrare dan dilaporkan sudah tidak disulam oleh generasi sebelum ini?\n2. Apabila Cikgu pertama kali memperkenalkan variasi motif Bunga Mawar (rujukan\ndaripada koleksi Muzium Sarawak) ini kepada Donna, adakah cikgu yakin ia dapat\nditerjemahkan dengan baik ke dalam bentuk kontemporari seperti Keringkam Charms\nini?\n3. Berdasarkan penglibatan cikgu dalam memantau kawalan kualiti dan membimbing\npenenun muda untuk projek Dear Origin ini, sejauh manakah inisiatif produk mini seperti\ncharm beg ini mampu membantu menjana ekonomi pengamal kraf tempatan?\n4. Akhir sekali, apakah pesanan anda berdua kepada generasi muda di luar sana agar seni\nKeringkam Sarawak ini tidak 'hilang ditelan zaman'\n, sebaliknya terus mekar seperti\nBunga Mawar Astana?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-67", "episode": null, "capsule": "", "type": "Interview", "topic": "Kak Bannie", "description": "", "guest": "", "title": "", "location": "KCH", "date": "2026-08-28", "status": "CANCELLED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-68", "episode": null, "capsule": "", "type": "Interview", "topic": "Tamin Dana", "description": "Telian", "guest": "", "title": "", "location": "MUKAH", "date": "2026-08-28", "status": "CANCELLED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-69", "episode": 13, "capsule": "2", "type": "Interview", "topic": "Kebun Cili, Oya", "description": ".", "guest": "", "title": "", "location": "MUKAH", "date": "2026-08-28", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-70", "episode": 9, "capsule": "4", "type": "Interview", "topic": "LV Choo Batik", "description": "", "guest": "", "title": "", "location": "MELAKA", "date": "2026-09-02", "status": "FILMED", "duration": "", "questions": "SKRIP SOALAN KAPSUL ANGGUN\nSubjek: LV Choo\nDurasi: 7 Minit\n1. Boleh kongsikan bagaimana minat dan kecintaan anda terhadap seni lukisan batik\nbermula sehingga terdirinya galeri LV Choo Batik ini?\n2. Mengapa anda memilih untuk membuka galeri seni ini di kawasan warisan bersejarah\nseperti Lorong Hang Jebat/Jonker Street di Melaka?\n3. Apakah keunikan atau identiti utama teknik rekaan batik yang dihasilkan di galeri anda\nberbanding tekstil atau seni batik yang lain?\n4. Boleh ceritakan proses pembuatan batik buatan tangan di sini—daripada lakaran motif,\npenggunaan lilin (canting), hingga ke proses mewarna?\n5. Mengapa anda memutuskan untuk menganjurkan bengkel (workshop) lukisan batik\nuntuk orang awam dan pelancong, dan bukannya sekadar menjual karya seni yang\nsiap?\n6. Apakah maklum balas atau pengalaman paling bermakna yang pernah anda lihat\ndaripada pelancong tempatan mahupun antarabangsa yang pertama kali mencuba seni\nbatik di bengkel anda?\n7. Apakah cabaran terbesar yang anda hadapi sebagai penggiat seni batik dalam\nmempertahankan warisan budaya ini di tengah-tengah era moden?\n8. Bagaimana anda mengimbangi nilai ketelitian seni tradisional batik buatan tangan\ndengan permintaan pasaran yang mahukan sesuatu yang pantas?\n9. Sebagai seorang pereka dan penggiat seni, dari manakah anda sering mendapat\ninspirasi dalam menghasilkan corak atau motif baru pada setiap rekaan batik anda?\n10. Apakah harapan dan impian terbesar anda melalui LV Choo Batik untuk memastikan\nseni warisan batik Malaysia terus dihargai oleh generasi akan datang?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-71", "episode": 6, "capsule": "5", "type": "Interview", "topic": "Chasing Sunset Cafe", "description": "", "guest": "", "title": "", "location": "MELAKA", "date": "2026-09-02", "status": "TX", "duration": "", "questions": "SKRIP SOALAN KAPSUL ANGGUN\nSubjek: Chasing Sunset\nDurasi: 7 Minit\n1. Boleh kongsikan bagaimana bermulanya idea dan inspirasi di sebalik nama \"Chasing\nSunset Cafe\" serta pemilihan lokasi strategik di tepi pantai ini?\n2. Mengapa anda memilih konsep chasing sunset atau 'mengejar matahari terbenam' ini\nsebagai identiti dan jualan utama (unique selling point) kafe anda?\n3. Boleh ceritakan bagaimana suasana dan 'vibe' kafe ini berubah menjelang waktu lewat\npetang apabila pelanggan mula berkumpul untuk menyaksikan detik sunset?\n4. Dari sudut reka bentuk dan susun atur ruang, bagaimana anda memanfaatkan\nkeindahan semula jadi pantai ini untuk keselesaan pengunjung?\n5. Apakah cabaran terbesar mengendalikan perniagaan kafe berkonsepkan terbuka di tepi\nlaut, terutamanya apabila berhadapan dengan faktor cuaca hujan atau angin kencang?\n6. Bagaimana anda mengimbangi kualiti sajian makanan dan minuman di sini supaya ia\nbukan sekadar 'jual pemandangan'\n, tetapi juga memuaskan selera pelanggan?\n7. Boleh kongsikan kenangan atau kisah menarik daripada pelanggan yang memilih kafe\nini sebagai lokasi untuk momen istimewa mereka (seperti sambutan ulang tahun atau\nproposal)?\n8. Bagaimana sokongan daripada pelancong luar dan penduduk tempatan Melaka sendiri\nmembantu mempopularkan kafe ini di media sosial?\n\n9. Apakah harapan dan perancangan masa depan anda untuk Chasing Sunset Cafe dalam\nkekal menjadi destinasi wajib singgah di Melaka?\n4 Soalan Sampingan (Pekerja)\n1. Apakah peranan harian anda di sini dan bagaimana rasanya bekerja dengan\nberlatarbelakangkan pemandangan laut dan sunset setiap hari?\n2. Mengikut pemerhatian anda, apakah zon atau sudut tempat duduk yang paling menjadi\nrebutan pelanggan sewaktu waktu golden hour?\n3. Bagaimana anda dan pasukan kafe bekerjasama dengan pantas sewaktu waktu\nkemuncak petang apabila pesanan pelanggan masuk bertali-arus?\n4. Apakah reaksi atau maklum balas pengunjung yang paling kerap anda dengar sewaktu\nmereka menikmati suasana di Chasing Sunset Cafe ini?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-72", "episode": 11, "capsule": "5", "type": "Interview", "topic": "Baba House Hotel", "description": "", "guest": "", "title": "", "location": "MELAKA", "date": "2026-09-03", "status": "FILMED", "duration": "", "questions": "SKRIP SOALAN KAPSUL ANGGUN\nSubjek: Baba House\nDurasi: 7 Minit\n1. Boleh kongsikan sejarah dan asal-usul bangunan The Baba House ini, serta bagaimana\nidea untuk menukarkannya daripada rumah kedai warisan abad ke-19 kepada sebuah\nbutik hotel bermula?\n2. Apakah keunikan seni bina dan hiasan dalaman Baba Nyonya—seperti ukiran kayu,\njubin antik, dan courtyard terbuka—yang dipertahankan di sini bagi mengekalkan\nkeaslian sejarahnya?\n3. Bagaimana anda memastikan pengalaman penginapan di The Baba House\nmembolehkan tetamu betul-betul merasai 'kemewahan gaya hidup' keluarga Peranakan\nzaman dahulu?\n4. Boleh ceritakan bagaimana kewujudan restoran/kafe di dalam hotel ini melengkapkan\npengalaman tetamu melalui sajian kulinari asli Baba Nyonya?\n5. Apakah cabaran terbesar dalam mengendalikan dan memulihara (restoration) sebuah\nbangunan warisan bersejarah supaya ia kekal kukuh dan memenuhi piawaian\nkeselamatan hotel moden?\n6. Dari manakah koleksi perabot, perhiasan, dan barangan antik yang menghiasi setiap\nsudut The Baba House ini diperolehi?\n7. Bagaimana hotel ini mengimbangi kemudahan moden yang diperlukan oleh pelancong\nhari ini tanpa merosakkan nilai atau estetika tradisional Peranakan?\n\n8. Apakah kenangan atau maklum balas paling unik daripada tetamu antarabangsa\nmahupun tempatan yang pernah menginap di sini?\n9. Mengapa pemilihan lokasi di Jalan Tun Tan Cheng Lock (berdekatan Jonker Street) ini\nsangat bermakna dan memberi kelebihan kepada The Baba House?\n10. Apakah harapan anda untuk The Baba House dalam terus menjadi mercu tanda warisan\nbudaya Peranakan dan destinasi penginapan pilihan utama di Melaka?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-73", "episode": 9, "capsule": "3", "type": "Interview", "topic": "Rental Baba Nyonya Costume", "description": "", "guest": "", "title": "", "location": "MELAKA", "date": "2026-09-03", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-74", "episode": 8, "capsule": "5", "type": "Interview", "topic": "SwayFit Studio", "description": "", "guest": "", "title": "", "location": "KCH", "date": "2026-09-04", "status": "FILMED", "duration": "", "questions": "SKRIP SOALAN KAPSUL ANGGUN\nSubjek: Definisikan Semula Keyakinan Wanita\nDurasi: 7 Minit | Panel: SwayFit Studio\n1. Coach Silvia, boleh kongsikan apakah inspirasi atau titik tolak di sebalik\npenubuhan SwayFit Studio di Kuching, dan mengapa anda memilih konsep\neksklusif untuk golongan wanita sahaja (women-only)?\n2. Berbeza dengan gimnasium konvensional, SwayFit Studio mengamalkan polisi\nhanya melalui temu janji (appointment-only) tanpa pelanggan terus (no\nwalk-ins). Bagaimanakah pendekatan ini membantu mewujudkan ruang yang\nlebih selamat dan selesa bagi wanita?\n3. Ramai wanita berasa segan atau intimidated untuk memulakan gaya hidup aktif.\nBagaimanakah SwayFit Studio memastikan persekitaran yang disediakan adalah\nbebas daripada penghakiman (non-judgmental), terutamanya buat golongan\npemula (beginners)?\n4. Studio anda turut menampilkan tenaga pengajar bertauliah, termasuk jurulatih\ntermuda di Sarawak yang menerima pengiktirafan antarabangsa NASM.\nSejauh manakah faktor kepakaran ini memberi keyakinan kepada ahli yang\nberumur dari 17 tahun ke atas untuk berlatih di sini?\n5. Sesi senaman di SwayFit Studio dihadkan selama 1 jam bagi setiap sesi dengan\npelbagai pilihan seperti Dance Fitness, Yoga, HIIT (Strong Nation), serta Shaping\n& Toning. Mengapa kepelbagaian jenis senaman ini penting untuk pembentukan\nbentuk badan yang ideal (full-body shaping)?\n\n6. Bagi kelas Shaping & Toning, anda menggunakan peralatan seperti pemberat\nringan, kettlebell, dan dumbbell. Bagi wanita yang bimbang tubuh mereka\nmenjadi terlalu \"berotot\" atau sado, apakah penjelasan Coach Silvia mengenai\nkebaikan latihan bebanan ini?\n7. Melalui SwayFit Studio, anda bukan sahaja membina kecergasan fizikal tetapi\njuga kekuatan mental dan keyakinan diri wanita. Apakah kisah transformasi ahli\nyang paling berkesan di jiwa Coach Silvia sepanjang mengendalikan studio ini?\n8. Sebagai penutup, apakah mesej atau pesanan Coach Silvia kepada wanita di\nluar sana yang masih teragak-agak untuk memulakan langkah pertama mereka\ndalam dunia kecergasan?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-75", "episode": null, "capsule": "", "type": "Interview", "topic": "tbc", "description": "tbc", "guest": "", "title": "", "location": "MELAKA", "date": "2026-09-04", "status": "CANCELLED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-76", "episode": 6, "capsule": "2", "type": "Interview", "topic": "Toko Ce' Rose", "description": "", "guest": "", "title": "", "location": "MELAKA", "date": "2026-09-04", "status": "TX", "duration": "", "questions": "SKRIP SOALAN KAPSUL ANGGUN\nSubjek: Toko Ce’ Ros\nDurasi: 7 Minit\n1. Sebagai seorang wanita muda, bagaimana rasanya memikul tanggungjawab besar\nmeneruskan legasi Toko Ce' Rose yang diasaskan oleh ibu anda?\n2. Boleh kongsikan detik atau keputusan peribadi yang membuatkan anda nekad untuk\nmelangkah masuk dan mengemudikan perniagaan warisan ini secara penuh masa?\n3. Apakah cabaran terbesar yang anda hadapi sebagai wanita generasi baharu dalam\nmengekalkan keaslian Kebaya Nyonya tradisional sambil cuba menyerapkan cita rasa\nmoden?\n4. Boleh ceritakan bagaimana anda mengimbangi pelbagai peranan penting sebagai\nseorang wanita berkerjaya, pereka, anak, dan juga peranan dalam keluarga?\n5. Pernahkah anda berdepan dengan rasa ragu-ragu (self-doubt) atau tekanan untuk\nmengatasi pencapaian generasi terdahulu, dan bagaimana anda membina keyakinan\ndiri?\n6. Apakah inovasi atau sentuhan wanita moden yang telah anda bawa ke dalam Toko Ce'\nRose bagi memastikan warisan ini kekal relevan dalam industri fesyen hari ini?\n7. Bagaimanakah perniagaan kraf warisan ini memperkasakan (empower) diri anda untuk\nmenjadi seorang wanita yang independen, berani, dan berdaya saing?\n8. Apakah pengalaman atau kenangan paling menyentuh hati sepanjang anda\nmenyarungkan Kebaya Nyonya hasil rekaan anda kepada pelanggan wanita lain?\n\n9. Sebagai figura wanita muda yang memelihara identiti budaya, apakah mesej dan\ninspirasi yang mahu anda sampaikan kepada anak-anak muda di luar sana?\nSoalan Sampingan (Suami)\n1. Dari mata anda sendiri, bagaimana anda melihat kecekalan dan transformasi Emmy\nsejak dia mengambil peranan penting dalam menguruskan Toko Ce' Rose?\n2. Apakah sifat atau keperibadian Emmy sebagai seorang wanita yang paling anda kagumi\napabila dia berdepan dengan cabaran dunia perniagaan?\n3. Bagaimana anda dan ahli keluarga saling melengkapi bagi menyokong visi serta\npergerakan Emmy dalam memajukan legasi ini?\n4. Apakah perubahan atau pencapaian terbesar yang paling membanggakan pernah\ndibawa oleh Emmy sepanjang dia menerajui perniagaan ini?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-77", "episode": null, "capsule": "2", "type": "Interview", "topic": "Koboba Nyonya", "description": "", "guest": "", "title": "", "location": "MELAKA", "date": "2026-09-04", "status": "TX", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-78", "episode": 6, "capsule": "4", "type": "Interview", "topic": "Keropok Inang-inang", "description": "", "guest": "", "title": "", "location": "MELAKA", "date": "2026-09-05", "status": "TX", "duration": "", "questions": "SKRIP SOALAN KAPSUL ANGGUN\nSubjek: Keropok Inang-Inang\nDurasi: 7 Minit\n1. Boleh kongsikan asal-usul perusahaan inang-inang ini yang bermula daripada arwah\nnenek, dibawa ke Kampung Kandang oleh ibu, hinggalah disambung oleh anda sebagai\ngenerasi ketiga?\n2. Apakah yang membuatkan anda nekad meninggalkan pekerjaan tetap dan mengambil\nalih perusahaan ini secara penuh masa selepas melihat ibu semakin kurang sihat?\n3. Boleh ceritakan pengalaman awal anda dan suami menjelajah dari sebuah kedai ke\nsebuah kedai sewaktu hanya mampu mengeluarkan 200 hingga 300 paket seminggu?\n4. Apakah proses tradisional yang perlu dilalui—daripada rendaman beras pulut,\npengukusan, hingga penjemuran—sehingga memakan masa 5 hingga 7 hari bagi\nmenghasilkan inang-inang yang berkualiti?\n5. Mengapa anda masih amat bergantung kepada cahaya matahari dan cuaca panas\nwalaupun sudah mempunyai kemudahan ketuhar (oven) di kilang?\n6. Sejauh mana faktor cuaca seperti hujan menjadi cabaran terbesar sehingga\nkeseluruhan hasil inang-inang berisiko berkulat dan terpaksa dibuang?\n7. Daripada ratusan paket seminggu, bagaimana rasa bangga anda apabila melihat\nperniagaan ini kini mampu memproses sehingga 3 hingga 6 ton beras pulut sebulan dan\nmenembusi pasaran Singapura?\n8. Bagaimana sokongan serta pembabitan suami dan pekerja tempatan banyak membantu\nmengukuhkan perniagaan Berkat Global Makmur Enterprise sehingga ke hari ini?\n9. Apakah harapan Mak Cik Fatimah sendiri apabila melihat warisan turun-temurun dari\nAlai ke Kampung Kandang ini berjaya dipertahankan oleh anak sendiri?\n10. Apakah hasrat dan impian anda untuk memastikan makanan tradisional warisan Melaka\nini kekal relevan dan tidak luput ditelan zaman bagi generasi akan datang?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-111", "episode": 11, "capsule": "1", "type": "Interview", "topic": "Healthy Fruit Mochi", "description": "Ray's Place", "guest": "", "title": "", "location": "KCH", "date": "2026-09-15", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-112", "episode": 13, "capsule": "1", "type": "Interview", "topic": "Mandian Bunga", "description": "Ray's Place", "guest": "", "title": "", "location": "KCH", "date": "2026-09-15", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-113", "episode": 12, "capsule": "1", "type": "Interview", "topic": "Masker Routine", "description": "Ray's Place", "guest": "", "title": "", "location": "KCH", "date": "2026-09-17", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-114", "episode": 10, "capsule": "1", "type": "Interview", "topic": "Hair Routine", "description": "Ray's Place", "guest": "", "title": "", "location": "KCH", "date": "2026-09-17", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-115", "episode": 6, "capsule": "1", "type": "Interview", "topic": "Morning & Night Skincare Routine", "description": "Ray's Place", "guest": "", "title": "", "location": "KCH", "date": "2026-09-18", "status": "TX", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-116", "episode": 9, "capsule": "1", "type": "Interview", "topic": "Herbal tea", "description": "Ray's Place", "guest": "", "title": "", "location": "KCH", "date": "2026-09-18", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-117", "episode": null, "capsule": "", "type": "Interview", "topic": "Pasangan Crafty", "description": "Saradise", "guest": "", "title": "", "location": "", "date": "", "status": "CANCELLED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-118", "episode": 10, "capsule": "3", "type": "Interview", "topic": "Breastfeeding", "description": "Diaries Emporium", "guest": "Dr. Dinnie Lai", "title": "Pakar Kanak-kanak", "location": "", "date": "", "status": "FILMED", "duration": "", "questions": "Dr. Dinnie Lai\n1. Boleh kongsikan apa yang mendoronk anda sebagai seorang doktor untuk\nmemfokuskan kepakaran dalam bidang kaunseling penyusuan susu ibu (breastfeeding\ncounselling)?\nCould you share what motivated you as a medical doctor to specialize and focus on\nbreastfeeding counselling?\n2. Mengapa fasa persediaan seawal waktu kehamilan itu sangat penting bagi seorang ibu\nsebelum memulakan perjalanan penyusuan (kickstarting breastfeeding)?\nWhy is early preparation during pregnancy so crucial for mothers before kickstarting their\nbreastfeeding journey?\n3. Apakah cabaran fizikal dan emosi yang paling kerap dihadapi oleh ibu-ibu\nbaharu—seperti latch yang betul, masalah bengkak susu (engorgement), atau bekalan\nsusu berkurang—dan bagaimana doktor membantu mereka?\nWhat are the most common physical and emotional challenges new mothers face—such\nas proper latching, engorgement, or low milk supply—and how do you help them\nnavigate these issues?\n4. Boleh ceritakan peranan kedai Dearies di Emporium ini dalam menyediakan ruang\nsokongan dan kelengkapan ibu & bayi yang mesra penyusuan?\nCould you share the role of Dearies store here at Emporium in providing a supportive\nspace and lactation-friendly essentials for mothers and babies?\n5. Bagaimanakah sokongan dan kefahaman daripada suami serta ahli keluarga\nmemainkan peranan kunci dalam kejayaan penyusuan seorang ibu?\nHow crucial is the support and understanding from husbands and family members in\nensuring a mother's breastfeeding success?\n6. Apakah mitos atau tanggapan salah berkenaan penyusuan susu ibu yang paling kerap\nanda jumpa dalam kalangan masyarakat tempatan?\nWhat are the most common myths or misconceptions regarding breastfeeding that you\nfrequently encounter among the local community?\n7. Untuk ibu-ibu bekerjaya (working mothers), apakah tip terbaik untuk mereka\nmenguruskan masa, rutin mengepam, dan penyimpanan susu ibu (milk storage) apabila\nkembali bekerja?\nFor working mothers, what are your top tips for managing time, pumping routines, and\nmilk storage when returning to the workplace?\n8. Mengapa pendidikan penyusuan secara praktikal—seperti bengkel dan konsultasi\nbersemuka—jauh lebih berkesan berbanding sekadar membaca maklumat di internet?\nWhy is hands-on breastfeeding education—such as workshops and face-to-face\nconsultations—far more effective than simply reading information online?\n9. Apakah pengalaman atau kisah kejayaan seorang ibu penyusuan yang paling\nmenyentuh hati sepanjang perkhidmatan anda di Kuching?\nWhat has been the most touching story or success of a breastfeeding mother during\nyour service in Kuching?\n10. Apakah mesej dan dorongan utama yang mahu anda sampaikan kepada semua ibu\nyang mungkin sedang bergelut atau berasa panik dalam perjalanan penyusuan mereka?\n\nWhat key message and encouragement would you like to give to mothers who might be\nstruggling or overwhelmed in their breastfeeding journey?\nKaunselor Rakan Sepasukan / Staf Dearies Emporium\n1. Apakah peranan harian anda di Dearies dalam membantu para ibu memilih kelengkapan\npenyusuan dan barangan bayi yang tepat?\nWhat is your daily role at Dearies in assisting mothers to choose the right breastfeeding\nequipment and baby essentials?\n2. Mengikut pemerhatian anda, apakah jenis pam susu atau produk penyusuan yang\npaling kerap dicari oleh bakal ibu apabila datang ke sini?\nBased on your observations, what types of breast pumps or lactation products are most\nfrequently sought after by expecting mothers visiting the store?\n3. Bagaimana anda melihat dedikasi Dr. Dinnie Lai dalam membimbing dan memberi\nkesedaran tentang penyusuan susu ibu kepada komuniti di Kuching?\nHow do you view Dr. Dinnie Lai’s dedication in guiding and raising awareness about\nbreastfeeding within the Kuching community?\n4. Mengapa anda berasa kewujudan ruang sokongan sebegini di Emporium Kuching\nsangat memberi kemudahan kepada para ibu muda?\nWhy do you feel having this dedicated support space at Emporium Kuching provides\ngreat convenience for young mothers?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-119", "episode": 7, "capsule": "5", "type": "Interview", "topic": "Candle Design", "description": "", "guest": "", "title": "", "location": "", "date": "", "status": "EDITED", "duration": "", "questions": "10 Soalan Utama (Pengasas / Artisan Molange Candle)\n1. Boleh kongsikan bagaimana minat anda terhadap seni kraf pembuatan lilin aromaterapi\n(candle making) ini bermula sehingga terdirinya jenama Molange Candle di Kuching?\n2. Mengapa anda memilih seni kraf lilin dan haruman ruang (home fragrance) ini sebagai\nperniagaan dan gaya hidup yang mahu diketengahkan kepada masyarakat tempatan?\n3. Boleh ceritakan proses asas pembuatan sebatang lilin beraroma buatan tangan\n(handcrafted scented candle)—daripada pemilihan bahan lilin, adunan minyak wangi\n(fragrance oil), hingga ke proses tuangan (hand-pouring)?\n4. Apakah tahap ketelitian atau cabaran paling kritikal dalam mengadunkan keharmonian\nharuman (scent profile) dan kadar leburan lilin untuk memastikan baunya menyebar\ndengan sempurna?\n5. Mengapa anda memutuskan untuk menganjurkan bengkel kraf (candle making\nworkshop) untuk orang awam, dan bukannya sekadar menjual produk siap?\n6. Apa yang membuatkan aktiviti membuat lilin ini menjadi satu hobi yang sangat diminati\nramai di Kuching, terutamanya dari sudut ketenangan jiwa (therapeutic effect)?\n7. Selain lilin aromaterapi, boleh ceritakan tentang keunikan kraf lain yang dihasilkan di\nstudio anda seperti scented plaster dan scented tag?\n8. Dari manakah anda sering mendapat inspirasi dalam mereka bentuk visual bentuk lilin\nyang estetika serta gabungan nota haruman baharu bagi setiap koleksi anda?\n9. Apakah cabaran terbesar dalam membangunkan jenama kraf kualiti buatan tangan\ntempatan apabila berhadapan dengan persaingan produk lilin komersial buatan kilang?\n10. Apakah harapan dan impian anda melalui Molange Candle untuk terus memupuk minat\nmasyarakat Kuching terhadap seni kraf aromaterapi ini pada masa hadapan?\nStaff\n1. Apakah peranan harian anda di Molange Candle dan bagaimana rasanya bekerja dalam\npersekitaran studio yang sentiasa dikelilingi haruman dan seni kraf ini?\n2. Mengikut pemerhatian anda, apakah reaksi atau detik paling menggembirakan bagi\npeserta bengkel apabila mereka berjaya menghasilkan lilin buatan tangan mereka\nsendiri?\n3. Bagaimana anda melihat dedikasi dan kesabaran pengasas Molange Candle dalam\nmembimbing peserta serta menjaga kualiti setiap produk kraf di sini?\n4. Mengapa anda berasa aktiviti pembuatan lilin di studio ini merupakan satu pengalaman\nhobi dan gaya hidup yang sangat berbaloi untuk dicuba?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-120", "episode": null, "capsule": "", "type": "Interview", "topic": "Pesakit Preeclamsia", "description": "", "guest": "", "title": "", "location": "", "date": "", "status": "FILMED", "duration": "", "questions": "Bekas Pesakit Preeclampsia\n1. Boleh kongsikan bagaimana pengalaman awal kehamilan anda sebelum anda mula\nmenyedari ada perubahan atau rasa tidak sedap badan?\nCould you share what your early pregnancy experience was like before you began to\nnotice changes or felt something was amiss?\n2. Apakah simptom atau isyarat awal—seperti bengkak pada kaki/muka, sakit kepala teruk,\natau pandangan kabur—yang mula-mula anda rasakan tetapi mungkin disangka\nsebagai perubahan biasa kehamilan?\nWhat early symptoms or warning signs—such as swelling in the feet/face, severe\nheadaches, or blurred vision—did you first experience that you might have initially\nbrushed off as normal pregnancy changes?\n3. Apakah detik atau situasi yang akhirnya membuatkan anda memutuskan untuk terus\nbergegas ke hospital untuk pemeriksaan?\nWhat was the exact moment or incident that finally made you decide to rush to the\nhospital for a check-up?\n4. Boleh ceritakan perasaan anda sewaktu doktor mengesahkan anda mengalami\npreeclampsia dan menerangkan risiko bahayanya kepada anda dan bayi?\nCould you describe your emotions when the doctor confirmed you had preeclampsia and\nexplained the risks to both you and your baby?\n5. Bagaimana anda dan pasangan mengendalikan keadaan cemas sewaktu doktor perlu\nmembuat keputusan untuk proses kelahiran segera demi menyelamatkan nyawa anda\nberdua?\nHow did you and your partner handle the critical situation when doctors had to make the\ndecision for an immediate delivery to save both your lives?\n6. Apakah cabaran terbesar dari sudut emosi dan fizikal sewaktu proses pemulihan\nselepas melahirkan, terutamanya jika bayi anda perlu dipantau di wad NICU?\nWhat was the biggest emotional and physical challenge during your postpartum\nrecovery, especially if your baby needed monitoring in the NICU?\n7. Sejauh mana pengalaman ini mengajar anda tentang pentingnya untuk seorang wanita\nmendengar dan peka terhadap setiap perubahan kecil pada tubuh badan sendiri\n(listening to your body)?\nHow much did this experience teach you about the importance of a woman listening to\nher own body and being sensitive to every small change?\n8. Bagaimanakah sokongan dan keberadaan suami serta ahli keluarga menjadi kekuatan\nutama anda sewaktu melalui fasa sukar ini?\nHow crucial was the support and presence of your husband and family as your main\nsource of strength through this difficult phase?\n9. Mengapa penting bagi wanita luar sana untuk menggugurkan persepsi bahawa simptom\nseperti bengkak air atau pening kepala semasa hamil itu perkara \"biasa\"?\nWhy is it important for women out there to debunk the misconception that symptoms like\nwater retention or dizziness during pregnancy are always \"normal\"?\n10. Apakah mesej, dorongan, dan peringatan paling utama yang mahu anda sampaikan\nkepada bakal-bakal ibu di luar sana mengenai kesedaran preeclampsia?\n\nWhat key message, encouragement, and advice would you like to pass on to expecting\nmothers regarding preeclampsia awareness?\nSuami / Ahli Keluarga\n1. Boleh kongsikan pengalaman anda sewaktu mula-mula melihat perubahan kesihatan\nisteri dan detik cemas apabila dia dimasukkan ke hospital?\nCould you share your experience when you first noticed your wife’s health changing and\nthe tense moment when she was admitted to the hospital?\n2. Sebagai seorang suami/pasangan, bagaimana anda menguruskan emosi sendiri\nsewaktu perlu kekal tenang demi memberi kekuatan kepada isteri?\nAs a husband/partner, how did you manage your own emotions while staying calm to\nprovide strength for your wife?\n3. Apakah peringatan terbesar yang anda sekeluarga pelajari tentang kesihatan ibu hamil\nselepas melalui ujian preeclampsia ini?\nWhat was the biggest lesson your family learned regarding pregnant mothers' health\nafter going through this preeclampsia trial?\n4. Apakah nasihat anda kepada para suami di luar sana dalam memainkan peranan peka\ndan prihatin terhadap sebarang perubahan kesihatan isteri sewaktu hamil?\nWhat is your advice to husbands out there on being proactive and sensitive to any\nchanges in their wife’s health during pregnancy?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-121", "episode": 12, "capsule": "3", "type": "Interview", "topic": "PMOS", "description": "Normah", "guest": "Dr. Natalie Neo Wen Ting", "title": "", "location": "", "date": "", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-122", "episode": 6, "capsule": "3", "type": "Interview", "topic": "Preeclamsia", "description": "Normah", "guest": "Dr. Natalie Neo Wen Ting", "title": "", "location": "", "date": "", "status": "TX", "duration": "", "questions": "Bekas Pesakit Preeclampsia\n1. Boleh kongsikan bagaimana pengalaman awal kehamilan anda sebelum anda mula\nmenyedari ada perubahan atau rasa tidak sedap badan?\nCould you share what your early pregnancy experience was like before you began to\nnotice changes or felt something was amiss?\n2. Apakah simptom atau isyarat awal—seperti bengkak pada kaki/muka, sakit kepala teruk,\natau pandangan kabur—yang mula-mula anda rasakan tetapi mungkin disangka\nsebagai perubahan biasa kehamilan?\nWhat early symptoms or warning signs—such as swelling in the feet/face, severe\nheadaches, or blurred vision—did you first experience that you might have initially\nbrushed off as normal pregnancy changes?\n3. Apakah detik atau situasi yang akhirnya membuatkan anda memutuskan untuk terus\nbergegas ke hospital untuk pemeriksaan?\nWhat was the exact moment or incident that finally made you decide to rush to the\nhospital for a check-up?\n4. Boleh ceritakan perasaan anda sewaktu doktor mengesahkan anda mengalami\npreeclampsia dan menerangkan risiko bahayanya kepada anda dan bayi?\nCould you describe your emotions when the doctor confirmed you had preeclampsia and\nexplained the risks to both you and your baby?\n5. Bagaimana anda dan pasangan mengendalikan keadaan cemas sewaktu doktor perlu\nmembuat keputusan untuk proses kelahiran segera demi menyelamatkan nyawa anda\nberdua?\nHow did you and your partner handle the critical situation when doctors had to make the\ndecision for an immediate delivery to save both your lives?\n6. Apakah cabaran terbesar dari sudut emosi dan fizikal sewaktu proses pemulihan\nselepas melahirkan, terutamanya jika bayi anda perlu dipantau di wad NICU?\nWhat was the biggest emotional and physical challenge during your postpartum\nrecovery, especially if your baby needed monitoring in the NICU?\n7. Sejauh mana pengalaman ini mengajar anda tentang pentingnya untuk seorang wanita\nmendengar dan peka terhadap setiap perubahan kecil pada tubuh badan sendiri\n(listening to your body)?\nHow much did this experience teach you about the importance of a woman listening to\nher own body and being sensitive to every small change?\n8. Bagaimanakah sokongan dan keberadaan suami serta ahli keluarga menjadi kekuatan\nutama anda sewaktu melalui fasa sukar ini?\nHow crucial was the support and presence of your husband and family as your main\nsource of strength through this difficult phase?\n9. Mengapa penting bagi wanita luar sana untuk menggugurkan persepsi bahawa simptom\nseperti bengkak air atau pening kepala semasa hamil itu perkara \"biasa\"?\nWhy is it important for women out there to debunk the misconception that symptoms like\nwater retention or dizziness during pregnancy are always \"normal\"?\n10. Apakah mesej, dorongan, dan peringatan paling utama yang mahu anda sampaikan\nkepada bakal-bakal ibu di luar sana mengenai kesedaran preeclampsia?\n\nWhat key message, encouragement, and advice would you like to pass on to expecting\nmothers regarding preeclampsia awareness?\nSuami / Ahli Keluarga\n1. Boleh kongsikan pengalaman anda sewaktu mula-mula melihat perubahan kesihatan\nisteri dan detik cemas apabila dia dimasukkan ke hospital?\nCould you share your experience when you first noticed your wife’s health changing and\nthe tense moment when she was admitted to the hospital?\n2. Sebagai seorang suami/pasangan, bagaimana anda menguruskan emosi sendiri\nsewaktu perlu kekal tenang demi memberi kekuatan kepada isteri?\nAs a husband/partner, how did you manage your own emotions while staying calm to\nprovide strength for your wife?\n3. Apakah peringatan terbesar yang anda sekeluarga pelajari tentang kesihatan ibu hamil\nselepas melalui ujian preeclampsia ini?\nWhat was the biggest lesson your family learned regarding pregnant mothers' health\nafter going through this preeclampsia trial?\n4. Apakah nasihat anda kepada para suami di luar sana dalam memainkan peranan peka\ndan prihatin terhadap sebarang perubahan kesihatan isteri sewaktu hamil?\nWhat is your advice to husbands out there on being proactive and sensitive to any\nchanges in their wife’s health during pregnancy?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-123", "episode": 11, "capsule": "3", "type": "Interview", "topic": "Kanser Servik", "description": "Normah", "guest": "Dr. Natalie Neo Wen Ting", "title": "", "location": "", "date": "", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-124", "episode": 7, "capsule": "3", "type": "Interview", "topic": "Kanser Payudara", "description": "Normah", "guest": "Dr Rokayah binti Julaihi", "title": "", "location": "", "date": "", "status": "EDITED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-125", "episode": 8, "capsule": "3", "type": "Interview", "topic": "Obesity", "description": "Normah", "guest": "Dr. Sim Sing Yang", "title": "", "location": "", "date": "", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-126", "episode": 13, "capsule": "3", "type": "Interview", "topic": "Dietition", "description": "Normah", "guest": "Ms Goh Ruey Shin", "title": "Dietition", "location": "", "date": "", "status": "FILMED", "duration": "", "questions": "", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-127", "episode": 13, "capsule": "5", "type": "Interview", "topic": "Swimming Class", "description": "", "guest": "", "title": "", "location": "", "date": "", "status": "FILMED", "duration": "", "questions": "Swimming Coach\n1. Boleh kongsikan bagaimana bermulanya minat anda dalam bidang renang sehingga\nmemutuskan untuk menjadi seorang jurulatih renang bertauliah?\nCould you share how your passion for swimming began, leading to your decision to\nbecome a certified swimming coach?\n2. Mengapa kemahiran berenang ini bukan sekadar satu hobi atau sukan, tetapi satu\nkemahiran ikhtiar hidup (life-saving skill) yang wajib ada pada setiap individu?\nWhy is swimming not just a hobby or sport, but a crucial life-saving skill that every\nindividual should possess?\n3. Apakah cabaran terbesar yang kerap anda hadapi apabila mengajar pelajar yang\nmempunyai masalah fobia air (water phobia) atau takut pada kedalaman?\nWhat is the biggest challenge you often face when teaching students with water phobia\nor a fear of deep water?\n4. Boleh ceritakan pendekatan atau teknik khas yang anda gunakan untuk membina\nkeyakinan diri (water confidence) pelajar pada hari pertama latihan?\nCould you walk us through the approach or special techniques you use to build a\nstudent's water confidence on their first day?\n5. Dari sudut teknik asas—seperti kawalan pernafasan (breath control), apungan (floating),\ndan kayuhan (kicking)—yang mana satu paling kritikal untuk dikuasai terlebih dahulu?\nIn terms of basic techniques—like breath control, floating, and kicking—which is the\nmost critical to master first?\n6. Apakah perbezaan pendekatan atau tahap kesabaran yang diperlukan apabila mengajar\nkanak-kanak berbanding golongan dewasa (adult learners)?\nWhat are the differences in approach or patience required when teaching young children\ncompared to adult learners?\n7. Dari sudut kesihatan dan kecergasan, apakah manfaat fizikal dan mental yang luar\nbiasa apabila seseorang menjadikan renang sebagai rutin hobi mereka?\nIn terms of health and fitness, what are the amazing physical and mental benefits of\nmaking swimming a regular hobby?\n8. Apakah kesilapan atau tabiat buruk yang paling kerap dilakukan oleh mereka yang\nbelajar berenang sendiri tanpa bimbingan coach?\nWhat are the most common mistakes or bad habits made by people who try to learn\nswimming on their own without proper coaching?\n9. Boleh kongsikan pengalaman atau detik paling membanggakan sepanjang anda\nmengajar—seperti melihat pelajar yang sangat takut air akhirnya berjaya berenang\ndengan lancar?\nCould you share your proudest moment as a coach—such as seeing a student who was\nterrified of water finally swim with confidence?\n10. Apakah pesanan dan dorongan utama anda kepada sesiapa di luar sana yang berasa\n'dah terlambat' atau segan untuk mula belajar berenang?\nWhat is your main advice and encouragement for anyone out there who feels it is 'too\nlate' or feels self-conscious about learning to swim?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-128", "episode": 7, "capsule": "4", "type": "Interview", "topic": "Atma Alam", "description": "Batik Village", "guest": "", "title": "", "location": "", "date": "15 Oktober", "status": "EDITED", "duration": "", "questions": "Pengasas / Artis Utama Atma Alam\n1. Boleh kongsikan sejarah dan inspirasi di sebalik penubuhan Atma Alam Batik Art Village\npada tahun 1987, serta perjalanan membangunkan pusat seni batik ini di Langkawi?\nCould you share the history and inspiration behind founding Atma Alam Batik Art Village\nin 1987, and your journey in developing this batik art hub in Langkawi?\n2. Apakah identiti dan ciri khas rekaan batik buatan tangan (handcrafted batik) di Atma\nAlam yang membezakannya daripada batik tradisional lain di Malaysia?\nWhat is the distinct identity and design signature of handcrafted batik at Atma Alam that\nsets it apart from other traditional batik in Malaysia?\n3. Boleh ceritakan bagaimana gabungan latar belakang seni anda—seperti seni lukis cat\nminyak moden dan kraf canting batik—memberi keunikan pada galeri dan koleksi di\nsini?\nCould you describe how combining your artistic backgrounds—such as modern oil\npainting and traditional batik canting—adds uniqueness to the gallery and collections\nhere?\n4. Boleh perincikan proses pembuatan batik eksklusif di Atma Alam—daripada lakaran,\nproses mencanting lilin, mewarna, hingga ke proses memati warna dan merebus kain?\nCould you walk us through the creation process of exclusive batik at Atma Alam—from\nsketching, wax canting, dyeing, to color fixing and boiling the fabric?\n5. Mengapa Atma Alam memilih untuk membuka bengkel batik painting interaktif untuk\npelawat tempatan dan antarabangsa yang berkunjung ke Langkawi?\nWhy did Atma Alam choose to offer interactive batik painting workshops for local and\ninternational visitors traveling to Langkawi?\n6. Apa yang membuatkan aktiviti melukis batik ini menjadi satu hobi dan aktiviti gaya hidup\n(lifestyle activity) yang sangat diminati pengunjung pelancongan budaya?\nWhat makes batik painting such a popular hobby and lifestyle activity for cultural tourism\nenthusiasts?\n7. Dari manakah anda kerap mendapat inspirasi—seperti unsur alam semula jadi pulau\nLangkawi atau motif warisan—dalam menghasilkan rekaan baharu?\nWhere do you frequently draw inspiration from—such as Langkawi's natural elements or\nheritage motifs—when creating new designs?\n8. Apakah cabaran terbesar dalam memelihara keaslian batik buatan tangan (handmade\nbatik) apabila berhadapan dengan lambakan batik cetakan mesin komersial?\nWhat is the biggest challenge in preserving authentic handmade batik when competing\nwith mass-produced machine-printed batik?\n9. Boleh kongsikan pengalaman atau maklum balas paling bermakna daripada pelancong\nluar negara yang menyertai bengkel batik dan menghargai kraf warisan ini?\nCould you share a memorable experience or feedback from international tourists who\nparticipated in your batik workshops and appreciated this heritage craft?\n10. Apakah harapan dan impian anda untuk masa depan Atma Alam dalam terus\nmemperkasakan warisan seni batik Malaysia di persada antarabangsa?\n\nWhat are your hopes and dreams for the future of Atma Alam in continuing to champion\nMalaysian batik art on the international stage?\nPelukis Batik / Tenaga Pengajar Bengkel\n1. Apakah peranan harian anda di studio Atma Alam dalam membimbing pengunjung dan\nmemastikan kelancaran sesi bengkel batik?\nWhat is your daily role at the Atma Alam studio in guiding visitors and ensuring smooth\nbatik workshop sessions?\n2. Mengikut pemerhatian anda, apakah teknik atau fasa paling mencabar sewaktu\nmembimbing peserta yang pertama kali memegang canting dan lilin panas?\nBased on your observations, what is the most challenging technique or phase when\nguiding first-time participants handling a canting tool and hot wax?\n3. Apakah reaksi atau kepuasan yang biasa ditunjukkan oleh para peserta apabila mereka\nmelihat hasil lukisan batik buatan tangan mereka sendiri siap diproses?\nWhat reaction or satisfaction do participants usually show when they see their finished\nhandmade batik creations fully processed?\n4. Mengapa anda berasa pengalaman mencuba seni batik di Atma Alam ini merupakan\nsatu aktiviti warisan dan gaya hidup yang wajib dicuba apabila berada di Langkawi?\nWhy do you feel experiencing batik art at Atma Alam is a must-try heritage and lifestyle\nactivity when visiting Langkawi?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-129", "episode": 10, "capsule": "2", "type": "Interview", "topic": "Langkawi Sushi", "description": "Kisah nenek Jepun di Langkawi", "guest": "Masako Kato", "title": "Cef Sushi", "location": "", "date": "15 Oktober", "status": "FILMED", "duration": "", "questions": "Auntie Masako - Langkawi Sushi\n1. Boleh Auntie kongsikan sedikit bagaimana bermulanya keputusan untuk menetap dan\nmembuka kedai Langkawi Sushi di Kampung Pasir Hitam ini?\n2. Apakah perasaan Auntie apabila melihat ramai pelanggan dari pelbagai\ntempat—terutamanya anak-anak muda—datang ke sini untuk menikmati sushi buatan\ntangan Auntie?\n3. Boleh ceritakan rutin harian Auntie seawal pagi sewaktu menyediakan nasi sushi dan\nbahan-bahan segar di dapur?\n4. Apakah menu sushi atau hidangan sampingan (seperti wakame atau wasabi buatan\nsendiri) yang paling kegemaran para pelanggan di sini?\n5. Mengapa Auntie kekal memilih untuk menjual sushi ini pada harga yang sangat mampu\nmilik dan mesra pelanggan bermula RM1?\n6. Bagaimanakah Auntie menyesuaikan rasa sushi Jepun tradisional agar sesuai dengan\nselera tempatan masyarakat di Malaysia?\n7. Apakah perkara atau suasana yang paling Auntie suka tentang kehidupan di pulau\nLangkawi ini?\n8. Apakah yang memberi Auntie semangat dan kekuatan untuk terus membuka kedai dan\nmenyajikan sushi kepada pelanggan setiap hari terutamanya selepas kehilangan suami,\napa perbezaan hari-hari Aunty dengan Langkawi Sushi?\n9. Apakah kenangan atau perbualan paling manis bersama pelanggan yang pernah\nsinggah makan di Langkawi Sushi?\n10. Apakah pesanan atau doa ringkas Auntie untuk semua pelanggan dan tetamu yang\nsentiasa menyokong serta menyayangi Langkawi Sushi?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-130", "episode": 10, "capsule": "4", "type": "Interview", "topic": "Natasya Hudson", "description": "Ginger Vassel", "guest": "Natasha Hudson", "title": "Pelakon, Pemilik The Ginger Vassel", "location": "", "date": "16 Oktober", "status": "FILMED", "duration": "", "questions": "10 Soalan Utama (Natasha Hudson)\n1. Boleh kongsikan bagaimana bermulanya fasa baharu kehidupan anda apabila membuat\nkeputusan untuk berehat daripada dunia lakonan dan berpindah menetap di Langkawi\nbersama keluarga?\n2. Dari pentas glamor hiburan ke kehidupan berteraskan alam di pulau, apakah perubahan\nterbesar yang anda rasakan dalam perjalanan peribadi anda?\n3. Boleh ceritakan bagaimana anda dan suami menguruskan perniagaan sukan luncur\nombak (surfing) di samping membesarkan anak-anak di tepi pantai?\n4. Di samping surfing, bagaimana minat anda terhadap kraf tanah liat (pottery) bermula\nsehingga terbinanya studio seramik sendiri di sini?\n5. Apakah yang membuatkan aktiviti pembentukan tembikar (pottery) dan sukan laut\n(surfing) ini menjadi kombinasi terapi yang sangat menenangkan jiwa anda?\n6. Boleh ceritakan proses pembuatan karya seramik buatan tangan anda—daripada\nmembentuk tanah liat, proses pembakaran, hinggalah terhasilnya barangan seramik\nyang unik?\n7. Bagaimana anda membahagikan masa dan tenaga antara komitmen perniagaan, kraf\nseni, serta tanggungjawab utama sebagai seorang ibu dan isteri?\n8. Adakah anda merindui suasana di set penggambaran, atau adakah fasa kehidupan\nsekarang memberi kepuasan yang lebih bermakna buat anda?\n9. Apakah cabaran terbesar yang pernah anda hadapi dalam menguruskan perniagaan\ngaya hidup dan pelancongan di pulau mengikut musim tertentu?\n10. Apakah harapan serta impian anda untuk masa depan keluarga, perniagaan surfing, dan\nperkembangan studio pottery anda di Langkawi?\n4 Soalan Sampingan (Watak Pembantu / Suami - Jay Jasmin)\n1. Bagaimana anda melihat perjalanan penyesuaian Natasha daripada seorang pelakon\npopular kepada seorang yang sangat aktif dalam surfing, pottery, dan perniagaan\nkeluarga di sini?\n2. Apakah peranan dan kerjasama antara anda berdua dalam memastikan perniagaan\nsukan air serta studio seramik berjalan lancar?\n3. Dari pandangan anda, apakah kualiti atau ketabahan Natasha yang paling anda kagumi\nsepanjang membina kehidupan baharu di Langkawi ini?\n4. Apakah harapan anda untuk perniagaan serta kehidupan keluarga korang di sini pada\nmasa akan datang?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-131", "episode": 10, "capsule": "5", "type": "Interview", "topic": "Island Horses", "description": "kuda di Langkawi", "guest": "", "title": "", "location": "", "date": "16 Oktober", "status": "FILMED", "duration": "", "questions": "Pemilik / Pengasas Island Horses\n1. Boleh kongsikan bagaimana bermulanya minat dan kecintaan anda terhadap kuda\nsehingga menubuhkan Island Horses di Langkawi?\nCould you share how your passion and love for horses began, leading to the\nestablishment of Island Horses in Langkawi?\n2. Mengapa anda memilih lokasi berdekatan kawasan alam semula jadi Telaga Tujuh ini,\ndan apakah keunikan laluan menunggang (riding trails) yang ditawarkan di sini?\nWhy did you choose this location near the natural surroundings of Seven Wells, and\nwhat makes the riding trails offered here unique?\n3. Boleh ceritakan tentang baka-baka kuda yang dipelihara di Island Horses dan\nbagaimana anda memastikan setiap kuda berada dalam keadaan sihat dan gembira?\nCould you tell us about the horse breeds kept at Island Horses and how you ensure\neach horse remains healthy and well-cared for?\n4. Bagi pengunjung yang pertama kali mahu mencuba hobi menunggang kuda (first-time\nriders), bagaimana pihak anda membina keyakinan diri mereka sebelum memulakan\ntunggangan?\nFor first-time riders looking to try horseback riding, how does your team build their\nconfidence before embarking on the trail?\n5. Apakah cabaran terbesar dalam mengendalikan pusat ekuestrian di kawasan\npulau—terutamanya dari sudut penjagaan kesihatan, pemakanan, dan cuaca?\nWhat is the biggest challenge in operating an equestrian center on an island—especially\nregarding health care, diet, and weather?\n6. Apakah perbezaan pengalaman menunggang kuda merentasi trek hutan hujan tropika\nberbanding menyusuri pesisiran pantai di Langkawi?\nWhat is the difference between the experience of riding through the tropical rainforest\ntrail versus along the sandy beach in Langkawi?\n7. Mengapa aktiviti menunggang kuda ini disifatkan sebagai satu hobi yang sangat terapis\n(therapeutic) bagi mengeratkan hubungan manusia dengan alam dan haiwan?\nWhy is horseback riding considered a deeply therapeutic hobby for bonding humans with\nnature and animals?\n8. Boleh kongsikan aspek keselamatan asas (safety measures) yang paling diutamakan\nsewaktu membawa kumpulan penunggang meneroka kawasan luar studio/stabal?\nCould you share the fundamental safety measures prioritized when taking groups of\nriders on outdoor trail rides?\n9. Apakah kenangan atau maklum balas paling menyentuh hati daripada pengunjung\ntempatan mahupun antarabangsa yang pernah menunggang di Island Horses?\nWhat has been the most memorable or touching feedback from local or international\nguests who have ridden with Island Horses?\n10. Apakah harapan dan impian anda untuk masa depan Island Horses dalam\nmempromosikan hobi ekuestrian dan pelancongan mesra alam di Langkawi?\nWhat are your hopes and dreams for the future of Island Horses in promoting equestrian\nhobbies and eco-tourism in Langkawi?\n\nPengurus Stabal / Pembantu\n1. Apakah peranan harian anda di Island Horses dalam menguruskan rutin harian kuda\ndan mengiringi pengunjung sepanjang tunggangan?\nWhat is your daily role at Island Horses in managing the horses' routines and escorting\nguests during trail rides?\n2. Bagaimana anda mengenali personaliti atau 'watak' setiap kuda di sini untuk dipadankan\ndengan tahap kebolehan penunggang?\nHow do you get to know the distinct personality of each horse here to match them with a\nrider's skill level?\n3. Mengikut pemerhatian anda, apakah reaksi atau detik paling menggembirakan bagi\npengunjung apabila mereka mula mesra dengan kuda tunggangan mereka?\nBased on your observations, what is the most joyful reaction or moment for guests once\nthey start bonding with their assigned horse?\n4. Mengapa anda berasa pengalaman menunggang kuda di Island Horses ini merupakan\nsatu aktiviti gaya hidup (lifestyle) yang wajib dicuba apabila berada di Langkawi?\nWhy do you feel horseback riding at Island Horses is a must-try lifestyle experience\nwhen visiting Langkawi?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-140", "episode": 9, "capsule": "2", "type": "Interview", "topic": "Citarasa Dadi Dada", "description": "", "guest": "", "title": "", "location": "", "date": "", "status": "PREPRO", "duration": "", "questions": "Interview Questions for Diana (Citarasa Dadi Dada)\n1. Boleh kongsikan kisah di sebalik nama Citarasa Dadi Dada dan bagaimana idea untuk\nmemulakan perniagaan makanan ini bermula di Penang?\n2. Bagi mereka yang pertama kali mendengar, boleh terangkan apakah sebenarnya\nkonsep perkhidmatan mangkuk tingkat yang ditawarkan di sini dan bagaimana ia\nberoperasi setiap hari?\n3. Mengapa Citarasa Dadi Dada memilih untuk menghidangkan katering harian\nmenggunakan mangkuk tingkat tradisional berbanding bekas plastik gred makanan\nbiasa?\n4. Boleh ceritakan bagaimana menu harian dirancang—adakah lauk-pauk bertukar setiap\nhari, dan apakah jenis masakan yang menjadi hidangan utama?\n5. Dari segi saiz hidangan, sebekas mangkuk tingkat ini secara puratanya sesuai untuk\ndinikmati oleh berapa orang makan dalam sesebuah isi rumah atau pejabat?\n6. Mengikut pemerhatian anda, siapakah golongan pelanggan utama yang paling banyak\nmemanfaatkan perkhidmatan langganan mangkuk tingkat ini?\n7. Bagaimana pula dengan logistik penghantaran—bagaimana proses pertukaran mangkuk\ntingkat bersih dan penghantaran lauk panas dilakukan ke rumah pelanggan setiap hari?\n8. Apakah cabaran terbesar dalam menguruskan katering harian secara\nkonsisten—terutamanya dalam menjaga ketepatan masa penghantaran dan kualiti rasa\nmasakan?\n\n9. Bagi masyarakat hari ini, apakah nilai kebaikan atau nostalgia yang dibawa kembali\nmenerusi amalan makan lauk dari mangkuk tingkat ini bersama keluarga?\n10. Apakah harapan dan perancangan masa depan anda untuk memeperluaskan lagi\nperkhidmatan mangkuk tingkat Citarasa Dadih Dada ini kepada lebih ramai penduduk di\nPenang?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-141", "episode": 12, "capsule": "5", "type": "Interview", "topic": "Rium Forest", "description": "", "guest": "", "title": "", "location": "", "date": "", "status": "PREPRO", "duration": "", "questions": "Terrarium & Vivarium Artist\n1. Boleh kongsikan bagaimana minat anda terhadap seni kraf ekosistem mikro ini bermula\nsehingga terhasilnya ruang seni RiumForest di Penang?\nCould you share how your passion for micro-ecosystem art began, leading to the\ncreation of RiumForest in Penang?\n2. Bagi orang awam, boleh terangkan perbezaan asas antara terrarium, vivarium, dan\npaludarium yang dihasilkan di sini?\nFor the general public, could you explain the basic differences between a terrarium,\nvivarium, and paludarium created here?\n3. Boleh ceritakan proses asas pembentukan sesebuah terrarium—daripada pemilihan\nbekas kaca, penyusunan lapisan batu dan tanah, hinggalah pemilihan tumbuhan serta\nlumut?\nCould you walk us through the basic process of creating a terrarium—from selecting the\nglass container, layering stones and soil, to choosing the right plants and moss?\n4. Apakah kriteria paling penting dalam memastikan sesebuah terrarium mampu bertahan\nlama sebagai sebuah ekosistem mini yang seimbang?\nWhat is the most critical factor in ensuring a terrarium survives long-term as a balanced\nmini-ecosystem?\n5. Mengapa RiumForest memilih untuk menganjurkan bengkel (workshop) interaktif untuk\npengunjung, dan bukannya sekadar menjual hasil seni yang siap?\nWhy did RiumForest decide to conduct interactive workshops for visitors instead of\nsimply selling ready-made pieces?\n6. Apa yang membuatkan aktiviti mereka bentuk terrarium ini menjadi satu hobi yang\nsangat popular, terutamanya dari sudut ketenangan jiwa (therapeutic)?\nWhat makes terrarium making such a popular hobby, especially from a therapeutic or\nstress-relief standpoint?\n\n7. Dari manakah anda mendapat inspirasi dalam mereka bentuk lanskap semula\njadi—seperti susunan batu, tebing, dan hutan rekaan—dalam saiz kaca yang kecil?\nWhere do you draw inspiration from when designing natural landscapes—like rock\narrangements, cliffs, and miniature forests—inside small glass containers?\n8. Apakah cabaran terbesar yang kerap dihadapi oleh peserta kali pertama sewaktu\nmenyertai bengkel terrarium ini, dan bagaimana anda membimbing mereka?\nWhat is the biggest challenge first-time participants face during the workshop, and how\ndo you guide them through it?\n9. Bagaimana pulak dengan penjagaan terrarium di rumah—seperti keperluan cahaya dan\nkadar siraman—agar ia kekal segar?\nHow should a terrarium be cared for at home—in terms of lighting and watering—to\nensure it stays fresh and healthy?\n10. Apakah harapan dan impian anda melalui RiumForest dalam menggalakkan minat\nmasyarakat terhadap hobi dan seni ekosistem hijau ini?\nWhat are your hopes and dreams for RiumForest in encouraging public interest in green\necosystem hobbies and art?\n\nManager/Owner\n1. Boleh kongsikan konsep di sebalik penggabungan ruang kafe bersama bengkel\nterrarium/vivarium di bawah satu bumbung di RiumForest?\nCould you share the concept behind combining a cafe space with a terrarium/vivarium\nworkshop under one roof at RiumForest?\n2. Bagaimana maklum balas dan reaksi pengunjung apabila dapat menikmati minuman\nkafe sambil dikelilingi lanskap hijau dan persekitaran semula jadi di sini?\nWhat has been the response and reaction from customers being able to enjoy cafe\ndrinks while surrounded by lush green landscapes and nature?\n3. Apakah peranan harian anda dalam memastikan kelancaran pengurusan kafe serta\nkoordinasi sesi bengkel yang dijalankan untuk para pelanggan?\nWhat is your daily role in ensuring smooth operations between the cafe management\nand the coordination of customer workshops?\n4. Mengapa anda berasa pengalaman berkunjung ke RiumForest ini merupakan satu\naktiviti gaya hidup (lifestyle) yang sangat unik dan wajib dicuba apabila berada di\nPenang?\nWhy do you feel visiting RiumForest is a unique lifestyle experience that is a must-try\nwhen in Penang?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-142", "episode": 11, "capsule": "4", "type": "Interview", "topic": "WCC Penang", "description": "", "guest": "", "title": "", "location": "", "date": "", "status": "PREPRO", "duration": "", "questions": "Interview Questions for Women Center for Change Penang.\n1. Tahniah atas pelantikan anda sebagai pengarah baharu di WCC. Boleh kongsikan latar\nbelakang anda serta azam utama yang mahu anda capai sepanjang memimpin WCC?\nCongratulations on your appointment as the new Director at WCC. Could you share your\nbackground and your vision for leading WCC moving forward?\n2. Bagi mereka yang belum mengenali WCC, boleh jelaskan secara ringkas peranan\nutama dan perjalanan WCC dalam membendung keganasan terhadap wanita dan\nkanak-kanak di Penang?\nFor those unfamiliar with WCC, could you briefly explain WCC’s primary role and its\njourney in combating violence against women and children in Penang?\n3. Apakah langkah perkhidmatan serta sokongan segera—seperti kaunseling,\nperlindungan, dan bantuan perundangan—yang disediakan di WCC untuk membantu\nmangsa keganasan rumah tangga dan serangan seksual?\nWhat immediate support services—such as counselling, shelter, and legal\nassistance—are provided at WCC to help victims of domestic violence and sexual\nassault?\n4. Dari sudut pencegahan awal (prevention measures), apakah program kesedaran atau\npendidikan yang dijalankan di sekolah dan komuniti untuk mengelakkan wanita dan\nkanak-kanak daripada menjadi mangsa penderaan?\nIn terms of prevention measures, what awareness or educational programs are\nconducted in schools and communities to protect women and children from abuse?\n5. Bagaimanakah penglibatan dan kerjasama daripada pelbagai pihak—seperti badan\nkerajaan, pihak polis, hospital, dan sukarelawan—membantu mengukuhkan lagi impak\nkerja-kerja kebajikan WCC?\nHow does collaboration with various stakeholders—such as government bodies, the\npolice, hospitals, and volunteers—strengthen the impact of WCC's work?\n\n6. Apakah pesanan dan dorongan utama anda kepada mana-mana wanita atau mangsa di\nluar sana yang mungkin sedang takut atau buntu untuk tampil mendapatkan bantuan di\nWCC?\nWhat key message and encouragement would you give to any woman or victim out there\nwho may be afraid or hesitant to step forward and seek help from WCC?\n7. Sebagai sebuah NGO, apakah cabaran terbesar yang dihadapi oleh WCC untuk kekal\nberoperasi (stay afloat), dan apakah kaedah serta strategi kewangan yang digunakan?\nAs an NGO, what is the biggest challenge WCC faces to stay afloat financially, and what\nmethods or funding strategies?\nEg: Simple answer about Value Shop\n8. Boleh kongsikan konsep di sebalik penubuhan WCC Value Shop di Island 88 (Tanjong\nTokong), dan bagaimana perniagaan barang terpakai (thrift store) ini membantu\nmenyokong kelangsungan dana WCC?\nCould you share the concept behind the establishment of the WCC Value Shop at Island\n88, and how this thrift store model helps fund and sustain WCC’s operations?\n9. Apakah jenis barangan atau sumbangan daripada masyarakat yang diterima di Value\nShop ini, dan bagaimana penglibatan para sukarelawan membantu melancarkan\noperasinya harian?\nWhat types of items or community donations are accepted at the Value Shop, and how\ndo volunteers help keep its daily operations running?\n10. Selain mengumpul dana untuk mangsa keganasan, bagaimana WCC Value Shop ini\nturut mempromosikan gaya hidup mesra alam dan membina kesedaran awam dalam\nkalangan komuniti tempatan?\nBesides fundraising for victims of violence, how does the WCC Value Shop promote an\neco-friendly lifestyle and build public awareness within the local community?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-143", "episode": 8, "capsule": "4", "type": "Interview", "topic": "May Lim Siew Seng", "description": "Kasut Manik", "guest": "", "title": "", "location": "", "date": "", "status": "PREPRO", "duration": "", "questions": "Interview Questions for May Lim Siew Seng\n1. Boleh Puan ceritakan sedikit tentang latar belakang Puan sebelum bergelar Adigiru bagi\nseni jahitan Kasut manik ini?\n2. Boleh Puan kongsikan bagaimana minat serta kemahiran seni jahitan manik Nyonya ini\nmula dipelajari sewaktu zaman muda dahulu?\n3. Apakah perasaan Puan apabila dianugerahkan pengiktirafan Living Heritage Treasures\nAward (LHTA) oleh Penang Heritage Trust atas dedikasi memelihara kraf warisan ini?\n4. Boleh ceritakan proses dan ketelitian yang diperlukan untuk menghasilkan sepasang\nkasut manik Nyonya buatan tangan—daripada penyusunan corak, pemilihan manik kaca\nhalus, hinggalah ke proses sulaman?\n5. Puan terkenal dengan pendekatan moden dan kreatif. Bagaimanakah inovasi ini\nmembantu menarik minat generasi baharu terhadap kraf Nyonya?\n6. Mengapa Puan membuat keputusan untuk menyumbangkan yuran kelas mengajar\nkasut manik ini kepada badan-badan kebajikan kecil yang memerlukan?\n7. Apakah kepuasan terbesar yang Puan rasakan apabila melihat murid-murid daripada\npelbagai latar belakang kini mahir dan menghargai seni kraf Nyonya ini?\n8. Apakah harapan dan pesanan Puan kepada masyarakat Malaysia agar seni kraf\nwarisan kasut manik ini terus terpelihara dan dibanggakan sehingga ke generasi akan\ndatang?\n\nSoalan sampingan untuk Pelajar\n1. Boleh kongsikan bagaimana peribadi dan gaya Puan May Lim sewaktu\nmengajar—apakah ketelitian atau pesanan beliau yang paling membuatkan anda kagum\ndengan beliau?\n2. Apakah detik atau pengalaman paling bermakna buat anda sepanjang berguru dan\nmenimba ilmu seni kasut manik bersama Puan May Lim?\n3. Apakah yang mula-mula menarik minat anda untuk mempelajari seni kraf kasut manik\nNyonya ini, dan bagaimana perasaan anda apabila melihat hasil jahitan pertama anda\nmula menjadi?\n4. Selepas mempelajari kraf tradisional ini, bagaimana sudut pandang anda berubah\nterhadap nilai kesabaran, keindahan, dan kebanggaan memelihara warisan Nyonya ini?", "vo": "", "remarks": "", "profile": ""}, {"id": "rec-anggun-144", "episode": 12, "capsule": "4", "type": "Interview", "topic": "Katherine Joan Chua", "description": "Tropical Spice Garden", "guest": "", "title": "", "location": "", "date": "", "status": "PREPRO", "duration": "", "questions": "Interview Questions for Katherine Joan Chua\n1. Boleh kongsikan inspirasi di sebalik penubuhan Tropical Spice Garden di Teluk Bahang\ndan bagaimana minat anda terhadap alam semula jadi bermula?\nCould you share the inspiration behind establishing Tropical Spice Garden in Teluk\nBahang and how your passion for nature began?\n2. Sebagai sebuah santuari rempah-ratus tempatan, apakah antara spesies tumbuhan\natau rempah paling unik dan berharga yang terdapat di dalam taman ini?\nAs a local spice sanctuary, what are some of the most unique and valuable plant or spice\nspecies found inside this garden?\n3. Boleh ceritakan tentang program kelas memasak (Tropical Spice Garden Cooking\nSchool)—apa yang membuatkan pengalaman memasak di tengah-tengah rimba ini\nbegitu istimewa untuk pelawat?\nCould you tell us about the Tropical Spice Garden Cooking School—what makes\ncooking in the middle of a lush rainforest so special for visitors?\n4. Bagaimana Tropical Spice Garden menghubungkan aspek alam semula jadi, warisan\nkulinari tempatan, dan gaya hidup sihat (wellness) dalam satu destinasi?\nHow does Tropical Spice Garden connect nature, local culinary heritage, and a healthy\nlifestyle within one single destination?\n5. Apakah cabaran terbesar yang pernah anda hadapi dalam mengendalikan dan\nmemulihara sebuah taman tropika semulajadi agar ia kekal subur dan selamat untuk\npelawat?\nWhat is the biggest challenge you've faced in maintaining and preserving a natural\ntropical garden to keep it thriving and safe for visitors?\n\n6. Sewaktu menghadapi fasa mencabar seperti pandemik sebelum ini, bagaimana komuniti\ndan penyokong Spice Fam menjadi pendorong utama untuk taman ini kekal bertahan?\nDuring challenging times like the pandemic, how did the community and 'Spice Fam'\nsupporters play a vital role in keeping the garden open?\n7. Apakah aktiviti interaktif lain yang disediakan di sini selain daripada jelajah taman dan\nkelas memasak—seperti bengkel kraf atau aktiviti riadah keluarga?\nWhat other interactive activities are offered here besides garden tours and cooking\nclasses—such as craft workshops or family recreation?\n8. Dari sudut pendidikan, bagaimana taman ini membantu pelawat tempatan dan\nantarabangsa mengenali asal-usul rempah ratus yang digunakan dalam masakan\nseharian mereka?\nFrom an educational standpoint, how does this garden help local and international\nvisitors discover the roots of spices used in their daily meals?\n9. Apakah detik atau maklum balas paling menyentuh hati daripada pelawat yang pernah\nmerasai ketenangan jiwa sewaktu berada di taman ini?\nWhat is the most touching moment or feedback you have received from visitors who\nexperienced peace and healing while spending time in the garden?\n10. Apakah mesej utama dan harapan anda untuk setiap pengunjung yang melangkah\nmasuk ke Tropical Spice Garden ini?\nWhat is your main message and hope for every visitor who steps into Tropical Spice\nGarden?", "vo": "", "remarks": "", "profile": ""}], "throws": [{"id": "thr-anggun-16", "episode": 1, "topic": "VO PROMO", "description": "", "location": "KCH", "date": "2026-07-24", "sponsored": false, "status": "TX", "remarks": ""}, {"id": "thr-anggun-24", "episode": 4, "topic": "Opening", "description": "Damai Lagoon Resort: __________________", "location": "KCH", "date": "2026-08-04", "sponsored": true, "status": "TX", "remarks": ""}, {"id": "thr-anggun-25", "episode": 4, "topic": "Promo", "description": "Damai Lagoon Resort: __________________", "location": "KCH", "date": "2026-08-04", "sponsored": true, "status": "TX", "remarks": ""}, {"id": "thr-anggun-26", "episode": 4, "topic": "Throw 1", "description": "Damai Lagoon Resort: __________________", "location": "KCH", "date": "2026-08-04", "sponsored": true, "status": "TX", "remarks": ""}, {"id": "thr-anggun-27", "episode": 4, "topic": "Throw 2", "description": "Damai Lagoon Resort: __________________", "location": "KCH", "date": "2026-08-04", "sponsored": true, "status": "TX", "remarks": ""}, {"id": "thr-anggun-28", "episode": 4, "topic": "Throw 3", "description": "Damai Lagoon Resort: __________________", "location": "KCH", "date": "2026-08-04", "sponsored": true, "status": "TX", "remarks": ""}, {"id": "thr-anggun-29", "episode": 4, "topic": "Throw 4", "description": "Damai Lagoon Resort: __________________", "location": "KCH", "date": "2026-08-04", "sponsored": true, "status": "TX", "remarks": ""}, {"id": "thr-anggun-30", "episode": 4, "topic": "Throw 5", "description": "Damai Lagoon Resort: __________________", "location": "KCH", "date": "2026-08-04", "sponsored": true, "status": "TX", "remarks": ""}, {"id": "thr-anggun-31", "episode": 4, "topic": "Closing", "description": "Damai Lagoon Resort: __________________", "location": "KCH", "date": "2026-08-04", "sponsored": true, "status": "TX", "remarks": ""}, {"id": "thr-anggun-32", "episode": 2, "topic": "Opening", "description": "Mar
